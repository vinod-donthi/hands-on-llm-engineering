<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Promptfoo diff grid comparing prompt variants</title>
  <desc id="desc">Grid showing test cases across system_v1 and system_v2 prompts with pass and fail assertions.</desc>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Promptfoo diff grid -- prompt regression</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Same questions, two prompts, assertion pass/fail per cell</text>

  <rect x="40" y="58" width="640" height="28" rx="4" fill="#e2e8f0"/>
  <text x="120" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">Test case</text>
  <text x="300" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">system_v1</text>
  <text x="480" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">system_v2</text>
  <text x="620" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">Winner</text>

  <rect x="40" y="90" width="640" height="36" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="120" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Stipend $500</text>
  <rect x="260" y="98" width="80" height="20" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="300" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">PASS</text>
  <rect x="440" y="98" width="80" height="20" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="480" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">PASS</text>
  <text x="620" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">tie</text>

  <rect x="40" y="130" width="640" height="36" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="120" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Invented benefit</text>
  <rect x="260" y="138" width="80" height="20" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="300" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">PASS</text>
  <rect x="440" y="138" width="80" height="20" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="480" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">FAIL</text>
  <text x="620" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">v1</text>

  <rect x="40" y="170" width="640" height="36" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="120" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">CEO address refuse</text>
  <rect x="260" y="178" width="80" height="20" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="300" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">PASS</text>
  <rect x="440" y="178" width="80" height="20" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="480" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">PASS</text>
  <text x="620" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">tie</text>

  <rect x="40" y="210" width="640" height="36" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="120" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Verbose off-topic</text>
  <rect x="260" y="218" width="80" height="20" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="300" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">FAIL</text>
  <rect x="440" y="218" width="80" height="20" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="480" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">PASS</text>
  <text x="620" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">v2</text>

  <text x="360" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Run on every prompt/model diff PR -- block merge when v2 loses on critical cases</text>
</svg>
