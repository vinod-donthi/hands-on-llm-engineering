<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">DeepEval pytest integrated into CI pipeline</title>
  <desc id="desc">Flow from pytest test file through DeepEval metrics to CI pass or fail blocking merge.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">DeepEval + pytest -- fast CI layer</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Failed eval = failed build, same as unit tests</text>

  <rect x="40" y="68" width="140" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="110" y="92" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#475569">pytest -v</text>
  <text x="110" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">test_llm_eval.py</text>

  <line x1="184" y1="96" x2="216" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="68" width="160" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1d4ed8">DeepEval metrics</text>
  <text x="300" y="110" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">Faithfulness &gt;= 0.8</text>

  <line x1="384" y1="96" x2="416" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="68" width="120" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">GitHub Actions</text>
  <text x="480" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">eval-gate.yml</text>

  <line x1="544" y1="96" x2="576" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="68" width="100" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#166534">PASS</text>
  <text x="630" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Merge OK</text>

  <rect x="40" y="148" width="640" height="88" rx="8" fill="#1e293b"/>
  <text x="56" y="172" font-family="ui-monospace, monospace" font-size="9" fill="#22c55e">test_stipend_faithful PASSED  faithfulness=0.87</text>
  <text x="56" y="192" font-family="ui-monospace, monospace" font-size="9" fill="#22c55e">test_pto_relevancy PASSED   relevancy=0.82</text>
  <text x="56" y="212" font-family="ui-monospace, monospace" font-size="9" fill="#ef4444">test_invented_benefit FAILED  faithfulness=0.41 &lt; 0.75</text>
  <text x="56" y="228" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">2 passed, 1 failed in 98s -- PR blocked</text>

  <text x="360" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">L1 fast layer: 5-10 samples, 1-3 min, ~$0.15 per PR run</text>
</svg>
