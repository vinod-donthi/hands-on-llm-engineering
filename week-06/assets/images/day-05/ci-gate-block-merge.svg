<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">CI eval gate blocking merge on regression</title>
  <desc id="desc">Pull request flow showing faithfulness drop from 0.78 to 0.62 blocking merge versus passing gate allowing merge.</desc>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">CI eval gate -- block merge on regression</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Max 5% faithfulness drop vs pinned baseline in eval/baseline.json</text>

  <rect x="40" y="58" width="300" height="180" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="190" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#dc2626">BLOCKED</text>
  <text x="190" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">PR #42: prompt tweak</text>
  <rect x="60" y="112" width="260" height="48" rx="4" fill="#1e293b"/>
  <text x="76" y="132" font-family="ui-monospace, monospace" font-size="8" fill="#ef4444">faithfulness: 0.62 (baseline 0.78)</text>
  <text x="76" y="148" font-family="ui-monospace, monospace" font-size="8" fill="#ef4444">regression: -20.5% &gt; 5% limit</text>
  <rect x="100" y="172" width="180" height="28" rx="4" fill="#ef4444"/>
  <text x="190" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ffffff">Merge blocked</text>
  <text x="190" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Artifacts: reports/*.json uploaded</text>

  <rect x="380" y="58" width="300" height="180" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">PASSED</text>
  <text x="530" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">PR #43: reranker fix</text>
  <rect x="400" y="112" width="260" height="48" rx="4" fill="#1e293b"/>
  <text x="416" y="132" font-family="ui-monospace, monospace" font-size="8" fill="#22c55e">faithfulness: 0.79 (baseline 0.78)</text>
  <text x="416" y="148" font-family="ui-monospace, monospace" font-size="8" fill="#22c55e">regression: +1.3% within limit</text>
  <rect x="440" y="172" width="180" height="28" rx="4" fill="#16a34a"/>
  <text x="530" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ffffff">Merge allowed</text>
  <text x="530" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">DeepEval fast + full RAGAS on main</text>

  <text x="360" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Gate makes quality non-negotiable -- same as unit test failures in GitHub Actions</text>
</svg>
