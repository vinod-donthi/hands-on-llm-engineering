<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Guardrail examples that block or sanitize requests</title>
  <desc id="desc">Input guardrails reject empty prompts and oversize text; output guardrails redact secrets and enforce cost caps.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Guardrails: deterministic checks</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Rule-based code before and after the LLM -- not another model call</text>

  <rect x="40" y="58" width="120" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="100" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">User</text>
  <line x1="164" y1="76" x2="200" y2="76" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="208" y="58" width="140" height="36" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="278" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9a3412">Input guards</text>
  <line x1="352" y1="76" x2="388" y2="76" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="396" y="58" width="100" height="36" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="446" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1d4ed8">LLM</text>
  <line x1="500" y1="76" x2="536" y2="76" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="544" y="58" width="136" height="36" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="612" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9a3412">Output guards</text>

  <rect x="40" y="108" width="310" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="128" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Input blocks</text>
  <text x="56" y="148" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Empty prompt -&gt; HTTP 422</text>
  <text x="56" y="164" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">200K chars -&gt; HTTP 422 too long</text>
  <text x="56" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Est. cost $0.12, cap $0.05 -&gt; HTTP 400</text>
  <text x="56" y="196" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Daily budget hit -&gt; HTTP 429</text>
  <text x="56" y="220" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Injection patterns -&gt; log (Week 2+)</text>

  <rect x="370" y="108" width="310" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="386" y="128" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Output blocks</text>
  <text x="386" y="148" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">sk-proj-abc... in text -&gt; redact</text>
  <text x="386" y="164" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Log secret_leak event</text>
  <text x="386" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">JSON schema fail -&gt; parse_status</text>
  <text x="386" y="196" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Toxicity threshold (optional)</text>
  <text x="386" y="220" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Sanitize before returning to user</text>

  <text x="360" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Guardrails are code you own -- predictable, fast, auditable</text>
</svg>
