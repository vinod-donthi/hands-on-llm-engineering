<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">Tail-keep context trim drops oldest messages</title>
  <desc id="desc">System prompt is never dropped; oldest user-assistant pairs are removed until under token budget.</desc>
  <rect width="720" height="240" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Tail-keep trim strategy</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">12,000 tokens in history -- budget 8,000 input tokens</text>

  <rect x="40" y="58" width="640" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="360" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#92400e">System prompt (500 tok) -- NEVER DROP</text>

  <rect x="40" y="94" width="200" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="140" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">msg 1-4 (drop)</text>
  <rect x="252" y="94" width="200" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="352" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">msg 5-8 (drop)</text>
  <rect x="464" y="94" width="216" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="572" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">msg 9-16 (drop)</text>

  <text x="360" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Drop oldest pairs until under budget</text>

  <rect x="40" y="156" width="640" height="28" rx="4" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="360" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#166534">Keep last 14 messages (7,500 tok) -- send to model</text>

  <rect x="120" y="196" width="480" height="36" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1d4ed8">Full history in Postgres | Trim only what you send</text>
  <text x="360" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Log trimmed_messages_count: 16</text>
</svg>
