<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Function calling tool loop message flow</title>
  <desc id="desc">User question flows through LLM tool call, app execution, tool result, and final natural language answer.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Tool loop: calculate example</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">847 x 293 -- model proposes, your code executes</text>

  <rect x="40" y="58" width="100" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="90" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">User</text>

  <line x1="140" y1="78" x2="168" y2="78" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="176" y="58" width="100" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="226" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">App</text>

  <line x1="276" y1="78" x2="304" y2="78" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="312" y="58" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="362" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1d4ed8">LLM</text>

  <text x="40" y="118" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">1. messages + tool schema</text>
  <rect x="40" y="128" width="640" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="56" y="148" font-family="ui-monospace, monospace" font-size="9" fill="#92400e">2. LLM returns tool_call: calculate(&quot;847 * 293&quot;) -- no final answer yet</text>

  <line x1="362" y1="160" x2="362" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="192" width="164" height="40" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="362" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#166534">Tool.execute</text>
  <text x="362" y="224" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">-&gt; &quot;248171&quot;</text>

  <line x1="362" y1="232" x2="362" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="264" width="640" height="28" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="56" y="282" font-family="ui-monospace, monospace" font-size="9" fill="#1d4ed8">3. tool_result to LLM -&gt; 4. &quot;The result of 847 x 293 is 248,171.&quot;</text>
</svg>
