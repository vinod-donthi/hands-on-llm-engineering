<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Cross-provider JSON capability matrix</title>
  <desc id="desc">OpenAI supports strict json_schema, Anthropic uses tool or prompt JSON, Ollama relies on prompt plus Pydantic validation.</desc>
  <rect width="720" height="220" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Structured output capability matrix</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Read capabilities from models.yaml before choosing ladder step</text>

  <rect x="40" y="58" width="640" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="120" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Provider</text>
  <text x="280" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Strict JSON Schema</text>
  <text x="440" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">JSON mode</text>
  <text x="580" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Prompt-only</text>

  <rect x="40" y="94" width="640" height="36" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="120" y="116" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#2563eb">gpt-4o-mini</text>
  <text x="280" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a">Yes</text>
  <text x="440" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a">Yes</text>
  <text x="580" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">fallback</text>

  <rect x="40" y="130" width="640" height="36" fill="#fafafa" stroke="#e2e8f0"/>
  <text x="120" y="152" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#2563eb">claude-3-5-haiku</text>
  <text x="280" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">via tool</text>
  <text x="440" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f59e0b">Partial</text>
  <text x="580" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">fallback</text>

  <rect x="40" y="166" width="640" height="36" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="120" y="188" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#16a34a">llama3.1:8b</text>
  <text x="280" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">No</text>
  <text x="440" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f59e0b">Varies</text>
  <text x="580" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a">primary</text>

  <text x="360" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Unified parse_status + schema_ladder_step in every LLMResponse</text>
</svg>
