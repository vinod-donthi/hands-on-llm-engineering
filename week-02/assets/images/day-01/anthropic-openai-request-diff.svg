<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI vs Anthropic request shape for the same conversation</title>
  <desc id="desc">System prompt lives inside messages for OpenAI but as a top-level system field for Anthropic.</desc>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Same conversation, two API shapes</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Goal: system says &quot;Be brief.&quot; User says &quot;Hello.&quot;</text>

  <rect x="40" y="58" width="300" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="190" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">OpenAI Chat Completions</text>
  <rect x="56" y="88" width="268" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="68" y="106" font-family="ui-monospace, monospace" font-size="9" fill="#92400e">messages[0]: role=system, content=&quot;Be brief.&quot;</text>
  <rect x="56" y="124" width="268" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="68" y="142" font-family="ui-monospace, monospace" font-size="9" fill="#475569">messages[1]: role=user, content=&quot;Hello&quot;</text>
  <text x="56" y="172" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Response: choices[0].message.content (string)</text>
  <text x="56" y="190" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">max_tokens optional on many models</text>

  <rect x="380" y="58" width="300" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="530" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Anthropic Messages</text>
  <rect x="396" y="88" width="268" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="408" y="106" font-family="ui-monospace, monospace" font-size="9" fill="#92400e">system: &quot;Be brief.&quot; (top-level)</text>
  <rect x="396" y="124" width="268" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="408" y="142" font-family="ui-monospace, monospace" font-size="9" fill="#475569">messages[0]: role=user, content=&quot;Hello&quot;</text>
  <text x="396" y="172" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Response: content[{type:text, text:&quot;Hi!&quot;}]</text>
  <text x="396" y="190" font-family="system-ui, sans-serif" font-size="9" fill="#ea580c">max_tokens required</text>

  <text x="360" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Adapter maps CompletionRequest to each shape; frontend never sees vendor blocks</text>
</svg>
