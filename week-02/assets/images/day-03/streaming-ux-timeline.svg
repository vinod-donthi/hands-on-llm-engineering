<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Non-streaming vs streaming user experience timeline</title>
  <desc id="desc">Both modes take 8 seconds total but streaming shows first token at 155ms while non-streaming shows a spinner.</desc>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Same total time, different UX</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Prompt: &quot;Explain Kubernetes in 3 paragraphs&quot; (illustrative)</text>

  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Non-streaming</text>
  <line x1="40" y1="108" x2="680" y2="108" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="40" y="88" width="640" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="360" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Spinner... (blank screen 0-8000 ms)</text>
  <circle cx="680" cy="108" r="6" fill="#2563eb"/>
  <text x="680" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb">8s: all text</text>

  <text x="40" y="158" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Streaming</text>
  <line x1="40" y1="198" x2="680" y2="198" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="155" cy="198" r="6" fill="#16a34a"/>
  <text x="155" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#16a34a">TTFT 155ms</text>
  <text x="155" y="222" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">&quot;Kubernetes&quot;</text>
  <rect x="200" y="188" width="460" height="20" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="430" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb">Text grows token by token...</text>
  <circle cx="680" cy="198" r="6" fill="#2563eb"/>
  <text x="680" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">8s: done</text>

  <text x="360" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Log TTFT separately from total latency -- optimize what users feel</text>
</svg>
