<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">Provider stream chunks normalized to StreamChunk</title>
  <desc id="desc">OpenAI delta.content, Anthropic content_block_delta, and Ollama message.content all map to one StreamChunk type.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="240" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Normalize stream chunks across providers</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">BaseLLMProvider.stream() yields the same shape to FastAPI SSE</text>

  <rect x="40" y="58" width="180" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="130" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">OpenAI</text>
  <text x="130" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">delta.content</text>

  <rect x="40" y="124" width="180" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="130" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">Anthropic</text>
  <text x="130" y="162" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">content_block_delta</text>

  <rect x="40" y="190" width="180" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="130" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">Ollama</text>
  <text x="130" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">message.content</text>

  <line x1="224" y1="86" x2="288" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="224" y1="152" x2="288" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="224" y1="208" x2="288" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="296" y="88" width="128" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">Adapter</text>
  <text x="360" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">per provider</text>

  <line x1="428" y1="120" x2="492" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="88" width="180" height="64" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="590" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#166534">StreamChunk</text>
  <text x="590" y="126" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">text: str</text>
  <text x="590" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">finish_reason</text>

  <rect x="500" y="164" width="180" height="56" rx="6" fill="#1e293b"/>
  <text x="590" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#38bdf8">SSE to browser</text>
  <text x="590" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">event: token</text>
  <text x="590" y="214" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">event: done</text>
</svg>
