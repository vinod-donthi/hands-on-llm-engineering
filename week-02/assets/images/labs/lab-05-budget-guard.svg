<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Lab 5 context budget and cost guard responses</title>
  <desc id="desc">API responses showing trimmed message count, empty prompt 422, and cost cap 400 rejection.</desc>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Lab 5: guardrails and budget (illustrative)</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">ContextBudgetMiddleware + CostGuard + input validation</text>

  <rect x="40" y="58" width="200" height="200" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="140" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#166534">Success (trimmed)</text>
  <text x="56" y="98" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">HTTP 200</text>
  <text x="56" y="118" font-family="ui-monospace, monospace" font-size="8" fill="#16a34a">trimmed_messages: 16</text>
  <text x="56" y="136" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">input_tokens: 7800</text>
  <text x="56" y="154" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">cost_usd: 0.002</text>
  <text x="56" y="180" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Tail-keep dropped</text>
  <text x="56" y="194" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">oldest 16 messages</text>

  <rect x="260" y="58" width="200" height="200" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="360" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#9a3412">Empty prompt</text>
  <text x="276" y="98" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">HTTP 422</text>
  <text x="276" y="118" font-family="ui-monospace, monospace" font-size="8" fill="#ea580c">{</text>
  <text x="292" y="134" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">&quot;detail&quot;: &quot;Prompt</text>
  <text x="292" y="148" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">required&quot;</text>
  <text x="276" y="164" font-family="ui-monospace, monospace" font-size="8" fill="#ea580c">}</text>
  <text x="276" y="190" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Input guardrail</text>
  <text x="276" y="204" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">before LLM call</text>

  <rect x="480" y="58" width="200" height="200" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="580" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#991b1b">Cost cap</text>
  <text x="496" y="98" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">HTTP 400</text>
  <text x="496" y="118" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">{</text>
  <text x="512" y="134" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">&quot;detail&quot;: &quot;Exceeds</text>
  <text x="512" y="148" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">per-request cap&quot;</text>
  <text x="496" y="164" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">}</text>
  <text x="496" y="190" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Est. $0.12 &gt; cap $0.05</text>
  <text x="496" y="204" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">CostGuard rejects</text>

  <text x="360" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Env: MAX_COST_USD_PER_REQUEST, DAILY_BUDGET_USD</text>
</svg>
