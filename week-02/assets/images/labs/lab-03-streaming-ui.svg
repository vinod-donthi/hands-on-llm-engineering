<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Lab 3 SSE streaming UI with TTFT metrics</title>
  <desc id="desc">Chat panel showing tokens appearing incrementally with TTFT and latency metrics on stream completion.</desc>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Lab 3: streaming panel (illustrative)</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">POST /api/v1/stream -- SSE events: meta, token, done</text>

  <rect x="40" y="58" width="420" height="220" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="40" y="58" width="420" height="32" rx="8" fill="#f1f5f9"/>
  <text x="56" y="78" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Model:</text>
  <text x="110" y="78" font-family="ui-monospace, monospace" font-size="10" fill="#2563eb">gpt-4o-mini</text>

  <rect x="56" y="100" width="320" height="48" rx="6" fill="#f1f5f9"/>
  <text x="72" y="120" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">User: Explain SSE in one paragraph.</text>

  <rect x="56" y="156" width="380" height="72" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="72" y="176" font-family="system-ui, sans-serif" font-size="9" fill="#1a1a1a">SSE (Server-Sent Events) lets the server push</text>
  <text x="72" y="192" font-family="system-ui, sans-serif" font-size="9" fill="#1a1a1a">text to the browser over a long-lived HTTP</text>
  <text x="72" y="208" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb">connection...|</text>

  <rect x="480" y="58" width="200" height="220" rx="8" fill="#1e293b"/>
  <text x="580" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Metrics (done event)</text>
  <text x="496" y="108" font-family="ui-monospace, monospace" font-size="9" fill="#16a34a">ttft_ms: 155</text>
  <text x="496" y="128" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">latency_ms: 4200</text>
  <text x="496" y="148" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">output_tokens: 87</text>
  <text x="496" y="168" font-family="ui-monospace, monospace" font-size="9" fill="#ea580c">cost_usd: 0.00004</text>
  <text x="496" y="196" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Events received:</text>
  <text x="496" y="212" font-family="ui-monospace, monospace" font-size="8" fill="#38bdf8">meta, token x87, done</text>

  <text x="360" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Compare TTFT across OpenAI, Anthropic, and Ollama in benchmark report</text>
</svg>
