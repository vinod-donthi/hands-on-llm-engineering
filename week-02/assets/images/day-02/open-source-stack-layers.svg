<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Open source LLM stack layers from weights to your app</title>
  <desc id="desc">Three layers: model weights, runtime server like Ollama, and your FastAPI provider adapter.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="220" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Open-source stack (2026)</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Same BaseLLMProvider interface as cloud APIs</text>

  <rect x="60" y="68" width="160" height="72" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="140" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">Weights</text>
  <text x="140" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">llama3.1:8b</text>
  <text x="140" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">ollama pull</text>

  <line x1="224" y1="104" x2="268" y2="104" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="276" y="68" width="168" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Runtime</text>
  <text x="360" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Ollama :11434</text>
  <text x="360" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">CPU or GPU</text>

  <line x1="448" y1="104" x2="492" y2="104" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="68" width="160" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="580" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Your app</text>
  <text x="580" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">OllamaProvider</text>
  <text x="580" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">LLMResponse envelope</text>

  <rect x="120" y="160" width="480" height="44" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="360" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9a3412">Local: $0 per token | Privacy: data stays on device | Tradeoff: hardware limits</text>
  <text x="360" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Benchmark with same prompts as cloud -- let numbers decide</text>
</svg>
