<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI Agents SDK triage handoff to specialists</title>
  <desc id="desc">Triage agent routes research questions to Research agent and formatting tasks to Writer agent via handoffs.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">OpenAI Agents SDK handoffs</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Runner executes agent loop; Triage delegates via explicit handoff() calls</text>

  <rect x="280" y="58" width="160" height="48" rx="8" fill="#2563eb"/>
  <text x="360" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Triage Agent</text>
  <text x="360" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#bfdbfe">handoffs only -- routes intent</text>

  <line x1="320" y1="106" x2="160" y2="148" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="400" y1="106" x2="560" y2="148" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="220" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1d4ed8">research question</text>
  <text x="500" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1d4ed8">formatting task</text>

  <rect x="60" y="152" width="200" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Research Agent</text>
  <text x="160" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">tools: web_search</text>
  <text x="160" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Returns facts with source URLs</text>

  <rect x="460" y="152" width="200" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="560" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Writer Agent</text>
  <text x="560" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">tools: none</text>
  <text x="560" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Formats prior findings as memo</text>

  <rect x="40" y="240" width="640" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="360" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Runner.run_sync(triage, question) -- built-in tracing + guardrails vs LangGraph explicit graph</text>
</svg>
