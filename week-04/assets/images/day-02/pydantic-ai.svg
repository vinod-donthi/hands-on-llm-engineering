<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Pydantic AI typed input and output validation boundary</title>
  <desc id="desc">Raw LLM JSON passes through Pydantic models before tool execution and before entering agent state.</desc>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Pydantic AI typed boundary</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Schemas are the contract -- bad JSON rejected before it poisons the next LLM turn</text>

  <rect x="40" y="68" width="160" height="140" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="120" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#991b1b">Raw LLM output</text>
  <text x="56" y="112" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">{ &quot;url&quot;: &quot;not-a-url&quot;,</text>
  <text x="56" y="128" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">&quot;relevance&quot;: &quot;high&quot;,</text>
  <text x="56" y="144" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">&quot;extra_field&quot;: true }</text>
  <text x="120" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ea580c">Malformed types</text>
  <text x="120" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ea580c">Missing required fields</text>

  <rect x="240" y="88" width="240" height="100" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="360" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9a3412">Pydantic validation</text>
  <text x="360" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Citation(BaseModel)</text>
  <text x="360" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">url: HttpUrl, relevance: float</text>
  <text x="360" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">ValidationError or typed result</text>

  <rect x="520" y="68" width="160" height="140" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#166534">Typed agent state</text>
  <text x="536" y="112" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">CitationList(</text>
  <text x="552" y="128" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">citations=[</text>
  <text x="568" y="144" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">{ url, quote, 0.92 }</text>
  <text x="552" y="160" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">])</text>
  <text x="600" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">Safe for next node</text>

  <rect x="40" y="228" width="640" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1d4ed8">OpenAI Agents SDK: handoffs + guardrails</text>
  <text x="360" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Pydantic AI: strict typed I/O at each agent step (citations, reflection scores)</text>
</svg>
