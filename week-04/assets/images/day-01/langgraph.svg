<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph research state machine with shared state</title>
  <desc id="desc">Nodes plan research tools reflect write connected by edges with SQLite checkpoint after each step.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowOrange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">LangGraph research state machine</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Single ResearchState TypedDict passed between nodes; checkpoint after each step</text>

  <rect x="40" y="68" width="88" height="36" rx="6" fill="#16a34a"/>
  <text x="84" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">START</text>
  <line x1="128" y1="86" x2="148" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="152" y="68" width="72" height="36" rx="6" fill="#2563eb"/>
  <text x="188" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">plan</text>
  <line x1="224" y1="86" x2="244" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="248" y="68" width="88" height="36" rx="6" fill="#2563eb"/>
  <text x="292" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">research</text>
  <line x1="336" y1="86" x2="356" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="68" width="72" height="36" rx="6" fill="#2563eb"/>
  <text x="396" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">tools</text>
  <line x1="432" y1="86" x2="452" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="456" y="68" width="88" height="36" rx="6" fill="#2563eb"/>
  <text x="500" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">reflect</text>
  <line x1="544" y1="86" x2="564" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="568" y="68" width="72" height="36" rx="6" fill="#2563eb"/>
  <text x="604" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">write</text>
  <line x1="640" y1="86" x2="660" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="664" y="68" width="56" height="36" rx="6" fill="#64748b"/>
  <text x="692" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff">END</text>

  <path d="M396,104 L396,128 L292,128 L292,104" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="344" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#ea580c">tool_calls?</text>

  <path d="M500,104 L500,148 L292,148 L292,104" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="396" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#ea580c">coverage low?</text>

  <rect x="40" y="168" width="640" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">ResearchState (shared between all nodes)</text>
  <text x="80" y="210" font-family="ui-monospace, monospace" font-size="9" fill="#475569">question: str</text>
  <text x="220" y="210" font-family="ui-monospace, monospace" font-size="9" fill="#475569">messages: list</text>
  <text x="380" y="210" font-family="ui-monospace, monospace" font-size="9" fill="#475569">plan: list[str]</text>
  <text x="520" y="210" font-family="ui-monospace, monospace" font-size="9" fill="#475569">sources: list</text>
  <text x="80" y="232" font-family="ui-monospace, monospace" font-size="9" fill="#475569">findings: list[Finding]</text>
  <text x="280" y="232" font-family="ui-monospace, monospace" font-size="9" fill="#475569">final_report: str | None</text>
  <text x="480" y="232" font-family="ui-monospace, monospace" font-size="9" fill="#475569">tool_rounds: int</text>

  <rect x="280" y="268" width="160" height="28" rx="6" fill="#1e293b"/>
  <text x="360" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">SQLite checkpoints.sqlite</text>
</svg>
