<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Checkpoint resume after crash at step 11</title>
  <desc id="desc">SQLite checkpoints save state after each node; same thread_id resumes from step 4 without redoing searches.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Checkpointing and resume</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">thread_id=research-job-88 -- crash at step 4, resume without redoing steps 1-3</text>

  <rect x="40" y="68" width="640" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="88" font-family="ui-monospace, monospace" font-size="9" fill="#475569">config = {&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;research-job-88&quot;}}</text>

  <rect x="40" y="112" width="100" height="36" rx="6" fill="#2563eb"/>
  <text x="90" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff">1 plan</text>
  <rect x="40" y="152" width="12" height="12" rx="2" fill="#16a34a"/>
  <text x="60" y="162" font-family="system-ui, sans-serif" font-size="8" fill="#166534">saved</text>

  <rect x="160" y="112" width="100" height="36" rx="6" fill="#2563eb"/>
  <text x="210" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff">2 research</text>
  <rect x="160" y="152" width="12" height="12" rx="2" fill="#16a34a"/>
  <text x="180" y="162" font-family="system-ui, sans-serif" font-size="8" fill="#166534">saved</text>

  <rect x="280" y="112" width="100" height="36" rx="6" fill="#2563eb"/>
  <text x="330" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff">3 tools</text>
  <rect x="280" y="152" width="12" height="12" rx="2" fill="#16a34a"/>
  <text x="300" y="162" font-family="system-ui, sans-serif" font-size="8" fill="#166534">saved</text>

  <rect x="400" y="112" width="100" height="36" rx="6" fill="#2563eb"/>
  <text x="450" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff">4 research</text>
  <rect x="400" y="152" width="12" height="12" rx="2" fill="#16a34a"/>
  <text x="420" y="162" font-family="system-ui, sans-serif" font-size="8" fill="#166534">saved</text>

  <rect x="520" y="112" width="100" height="36" rx="6" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
  <text x="570" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff">CRASH</text>
  <text x="570" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">OOM / sleep</text>

  <rect x="40" y="188" width="640" height="48" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="360" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#991b1b">Process killed -- state persisted in checkpoints.sqlite</text>
  <text x="360" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">graph.invoke(None, config) -- same thread_id resumes from step 4</text>

  <rect x="400" y="252" width="100" height="36" rx="6" fill="#16a34a"/>
  <text x="450" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff">5 continue</text>
  <line x1="450" y1="236" x2="450" y2="252" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="580" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Idempotent tools: no duplicate API charges on retry</text>
</svg>
