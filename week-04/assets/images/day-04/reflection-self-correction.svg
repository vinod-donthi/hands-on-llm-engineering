<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Reflection loop with coverage score routing</title>
  <desc id="desc">Reflect node scores coverage at 0.55 and routes back to research when gaps remain instead of writing.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowOrange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Reflection and self-correction loop</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Critic turn before final write -- coverage score decides continue or finish</text>

  <rect x="60" y="68" width="88" height="36" rx="6" fill="#2563eb"/>
  <text x="104" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">research</text>
  <line x1="148" y1="86" x2="168" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="172" y="68" width="72" height="36" rx="6" fill="#2563eb"/>
  <text x="208" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">tools</text>
  <line x1="244" y1="86" x2="264" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="268" y="68" width="88" height="36" rx="6" fill="#2563eb"/>
  <text x="312" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">summarize</text>
  <line x1="356" y1="86" x2="376" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="68" width="72" height="36" rx="6" fill="#ea580c"/>
  <text x="416" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">reflect</text>

  <rect x="480" y="58" width="200" height="100" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="580" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#9a3412">coverage_score: 0.55</text>
  <text x="580" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">answered: GPAI definition</text>
  <text x="580" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">missing: max fines, start date</text>
  <text x="580" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ea580c">should_continue: true</text>
  <text x="580" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Pydantic typed output</text>

  <path d="M416,104 L416,140 L104,140 L104,104" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="260" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ea580c">back to research (gaps remain)</text>

  <line x1="452" y1="86" x2="480" y2="86" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="158" x2="580" y2="188" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="520" y="192" width="120" height="36" rx="6" fill="#16a34a"/>
  <text x="580" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">write</text>
  <text x="580" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">when coverage &gt;= threshold</text>

  <text x="360" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Lab 4 saves reflection_report.json with coverage score and next_actions</text>
</svg>
