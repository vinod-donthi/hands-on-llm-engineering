<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Agent memory tiers from short-term to long-term</title>
  <desc id="desc">Planning node writes sub-questions; short-term messages, working findings list, optional long-term store.</desc>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Agent memory and planning tiers</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Plan first, then execute -- remember findings in structured working memory</text>

  <rect x="40" y="58" width="640" height="52" rx="8" fill="#2563eb"/>
  <text x="360" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Planning node (plan)</text>
  <text x="360" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#bfdbfe">sub_questions: [Acme products, Q3 roadmap, overlap gaps] + tool_strategy</text>

  <rect x="40" y="124" width="200" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">Short-term</text>
  <text x="140" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">messages list</text>
  <text x="140" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Last N turns + tool results</text>
  <text x="140" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">In graph state</text>
  <text x="140" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Trim when context fills</text>

  <rect x="260" y="124" width="200" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="360" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#9a3412">Working memory</text>
  <text x="360" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">findings: list[Finding]</text>
  <text x="360" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">topic, source, summary</text>
  <text x="360" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Structured, not prose</text>
  <text x="360" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Survives context trim</text>

  <rect x="480" y="124" width="200" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="580" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Long-term (optional)</text>
  <text x="580" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Vector store / DB</text>
  <text x="580" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Cross-session facts</text>
  <text x="580" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Not required Week 4</text>
  <text x="580" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Lab 4 uses working memory</text>

  <text x="360" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Without planning: random searches. Without working memory: forgets prior findings when context fills.</text>
</svg>
