<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Lab 4 reflection coverage score and re-search routing</title>
  <desc id="desc">Agent plans sub-questions, stores findings, reflects with coverage 0.55, re-searches until threshold met.</desc>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Lab 4: expected reflection_report.json</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Plan, findings, reflect -- re-search when coverage below threshold</text>

  <rect x="40" y="58" width="300" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="190" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Coverage gauge</text>
  <rect x="80" y="92" width="220" height="16" rx="4" fill="#f1f5f9"/>
  <rect x="80" y="92" width="121" height="16" rx="4" fill="#ea580c"/>
  <text x="190" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff">0.55 / 0.80 threshold</text>
  <text x="190" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">answered: GPAI definition</text>
  <text x="190" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ea580c">missing: max fines, start date</text>
  <text x="190" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">findings stored: 3 items</text>
  <text x="190" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb">should_continue: true</text>
  <text x="190" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">next: web_search GPAI fines 2026</text>
  <text x="190" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Round 2 -- coverage rises to 0.85 -- write</text>

  <rect x="380" y="58" width="300" height="200" rx="8" fill="#1e293b"/>
  <rect x="380" y="58" width="300" height="24" rx="8" fill="#334155"/>
  <text x="530" y="74" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">reflection_report.json</text>
  <text x="396" y="100" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">&quot;plan&quot;: [&quot;GPAI definition&quot;, &quot;max fines&quot;, ...]</text>
  <text x="396" y="120" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">&quot;findings&quot;: [{topic, source, summary}, ...]</text>
  <text x="396" y="140" font-family="ui-monospace, monospace" font-size="8" fill="#fbbf24">&quot;coverage_score&quot;: 0.55</text>
  <text x="396" y="160" font-family="ui-monospace, monospace" font-size="8" fill="#fbbf24">&quot;missing_sub_questions&quot;: [&quot;max fines&quot;, ...]</text>
  <text x="396" y="180" font-family="ui-monospace, monospace" font-size="8" fill="#22c55e">&quot;should_continue_research&quot;: true</text>
  <text x="396" y="200" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">&quot;next_actions&quot;: [&quot;web_search: ...&quot;]</text>
  <text x="396" y="228" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">&quot;doc_search&quot;: 2 chunks from sample_policy.md</text>
  <text x="396" y="248" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">Week 3 retrieval wired as tool</text>

  <text x="360" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Deliverable: structured findings + reflection score drives re-search loop</text>
</svg>
