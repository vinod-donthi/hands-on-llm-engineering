<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Lab 2 OpenAI Agents SDK handoff trace</title>
  <desc id="desc">Triage routes research question to Research agent; formatting task goes to Writer agent.</desc>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Lab 2: expected handoff_trace.json</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Triage routes intent -- Research vs Writer specialist</text>

  <rect x="40" y="58" width="640" height="220" rx="8" fill="#1e293b"/>
  <rect x="40" y="58" width="640" height="28" rx="8" fill="#334155"/>
  <circle cx="58" cy="72" r="5" fill="#ef4444"/>
  <circle cx="74" cy="72" r="5" fill="#f59e0b"/>
  <circle cx="90" cy="72" r="5" fill="#22c55e"/>
  <text x="360" y="76" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">python lab02_openai_agents_sdk.py</text>

  <text x="56" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Input: &quot;Summarize EU AI Act enforcement news for legal.&quot;</text>
  <text x="56" y="128" font-family="ui-monospace, monospace" font-size="9" fill="#38bdf8">[Triage] intent=research -- handoff to Research</text>
  <text x="56" y="148" font-family="ui-monospace, monospace" font-size="9" fill="#fbbf24">[Research] web_search -- 4 facts with URLs</text>
  <text x="56" y="168" font-family="ui-monospace, monospace" font-size="9" fill="#38bdf8">[Triage] handoff to Writer</text>
  <text x="56" y="188" font-family="ui-monospace, monospace" font-size="9" fill="#22c55e">[Writer] bullet memo formatted for legal team</text>
  <text x="56" y="212" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Wrote handoff_trace.json (3 agents, trace_id=abc-123)</text>

  <rect x="56" y="220" width="608" height="48" rx="4" fill="#0f172a"/>
  <text x="72" y="240" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">{ &quot;agent&quot;: &quot;Triage&quot;, &quot;action&quot;: &quot;handoff&quot;, &quot;target&quot;: &quot;Research&quot; }</text>
  <text x="72" y="256" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">{ &quot;agent&quot;: &quot;Research&quot;, &quot;tool&quot;: &quot;web_search&quot;, &quot;results&quot;: 4 }</text>

  <text x="360" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Deliverable: correct routing with built-in SDK tracing saved as JSON</text>
</svg>
