  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Graph pauses on fetch_url -- CLI Approve/Reject -- checkpoint persists</text>

  <rect x="40" y="58" width="640" height="220" rx="8" fill="#1e293b"/>
