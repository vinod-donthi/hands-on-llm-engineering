<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">MCP client-server tool discovery and call flow</title>
  <desc id="desc">LangGraph agent as MCP client discovers tools via list_tools then calls web_search on research-tools server.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">MCP client-server protocol</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">USB-C for agent tools -- one server, many compatible clients</text>

  <rect x="40" y="68" width="280" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">MCP Client (LangGraph agent)</text>
  <rect x="56" y="100" width="248" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="180" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">1. Startup: list_tools()</text>
  <rect x="56" y="136" width="248" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="180" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">2. Register 3 tools with LLM</text>
  <rect x="56" y="172" width="248" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="180" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">3. call_tool(&quot;web_search&quot;, args)</text>
  <rect x="56" y="208" width="248" height="28" rx="4" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="180" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">4. JSON snippets to LLM</text>

  <rect x="400" y="68" width="280" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="540" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">MCP Server (research-tools)</text>
  <rect x="416" y="100" width="248" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="540" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">web_search(query, max_results)</text>
  <rect x="416" y="132" width="248" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="540" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">fetch_url(url)</text>
  <rect x="416" y="164" width="248" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="540" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">cite_source(title, url, snippet)</text>
  <rect x="416" y="200" width="248" height="36" rx="4" fill="#1e293b"/>
  <text x="540" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Tavily / DuckDuckGo API</text>

  <line x1="320" y1="114" x2="400" y2="114" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="360" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1d4ed8">stdio / SSE</text>
  <line x1="400" y1="186" x2="320" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">structured result</text>

  <text x="360" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Move tools between LangGraph, Cursor, and CLI without rewriting adapters</text>
</svg>
