<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Lab 6 pgvector migration report</title>
  <desc id="desc">Chroma vectors migrated to PostgreSQL pgvector with matching chunk counts and smoke query.</desc>
