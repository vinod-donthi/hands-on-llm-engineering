  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Mirror Chroma index into PostgreSQL document_chunks table</text>

  <rect x="80" y="68" width="140" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
