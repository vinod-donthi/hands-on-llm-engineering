  <text x="354" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#9a3412">lab06_migrate</text>
  <text x="354" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Alembic + copy</text>

  <line x1="424" y1="96" x2="484" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

