  <text x="56" y="262" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">{ &quot;chroma_count&quot;: 247, &quot;pg_count&quot;: 247, &quot;top1_match&quot;: true }</text>

  <text x="360" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Optional -- not required for Week 3 exit if documented in progress.md</text>
