<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Bi-encoder retrieval with cosine similarity</title>
  <desc id="desc">Query and document chunks encoded independently into vectors; ANN search ranks by cosine similarity.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Bi-encoder retrieval</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Encode query and docs separately -- fast ANN search at query time</text>

  <rect x="40" y="62" width="200" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="140" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">User query</text>
  <text x="140" y="98" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#1a1a1a">&quot;rotate API keys staging&quot;</text>

  <line x1="140" y1="110" x2="140" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="132" width="120" height="36" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="140" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1d4ed8">Query encoder</text>

  <line x1="140" y1="168" x2="140" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="190" width="160" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="140" y="210" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#166534">q_vec [1536 dims]</text>

  <rect x="480" y="62" width="200" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="580" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Doc chunks (pre-indexed)</text>
  <text x="580" y="98" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#1a1a1a">2,400 runbook chunks</text>

  <line x1="580" y1="110" x2="580" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="520" y="132" width="120" height="36" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="580" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1d4ed8">Doc encoder</text>

  <line x1="580" y1="168" x2="580" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="190" width="160" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="580" y="210" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#166534">doc_vecs [1536 dims]</text>

  <line x1="220" y1="206" x2="340" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="206" x2="380" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="88" width="120" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="360" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#9a3412">Cosine sim</text>
  <text x="360" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">ANN top-20</text>
  <text x="360" y="138" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">~65 ms total</text>

  <text x="360" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Cross-encoder scores pairs together -- slower, used in rerank stage only</text>
</svg>
