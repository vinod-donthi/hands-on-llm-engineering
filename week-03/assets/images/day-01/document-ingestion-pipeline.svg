<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Document ingestion pipeline from file to searchable index</title>
  <desc id="desc">PDF or Markdown flows through parse, metadata, normalize, and raw store before chunking and embedding.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="220" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Document ingestion pipeline</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">First mile: clean text + metadata before chunking and embedding</text>

  <rect x="24" y="68" width="88" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="68" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">File</text>
  <text x="68" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">PDF / MD</text>

  <line x1="112" y1="90" x2="128" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="132" y="68" width="88" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="176" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1d4ed8">Parse</text>
  <text x="176" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">text per page</text>

  <line x1="220" y1="90" x2="236" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="68" width="88" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="284" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1d4ed8">Metadata</text>
  <text x="284" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">page, section</text>

  <line x1="328" y1="90" x2="344" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="348" y="68" width="88" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="392" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1d4ed8">Normalize</text>
  <text x="392" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">strip headers</text>

  <line x1="436" y1="90" x2="452" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="456" y="68" width="88" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="500" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Store raw</text>
  <text x="500" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">parsed JSON</text>

  <line x1="544" y1="90" x2="560" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="564" y="68" width="132" height="44" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="630" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#9a3412">Ready to chunk</text>
  <text x="630" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Week 3 downstream</text>

  <rect x="40" y="140" width="640" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="162" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">Risk if skipped</text>
  <text x="56" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Bad parse: garbled columns | No metadata: no citations | No normalize: &quot;Page 12 of 40&quot; in every chunk</text>
  <text x="56" y="192" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">No raw store: must re-parse to change chunk strategy</text>
</svg>
