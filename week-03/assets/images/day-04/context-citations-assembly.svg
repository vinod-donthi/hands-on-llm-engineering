<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Context assembly with source citations</title>
  <desc id="desc">Top chunks assembled into labeled context block within token budget for grounded LLM generation.</desc>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Context assembly and citations</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Retrieved chunks become a labeled context block within budget</text>

  <rect x="40" y="58" width="180" height="72" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="130" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1d4ed8">Retrieved chunks</text>
  <text x="56" y="96" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">c1 handbook p.12 (180 tok)</text>
  <text x="56" y="110" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">c2 handbook p.13 (220 tok)</text>
  <text x="56" y="124" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">c3 benefits PTO (150 tok)</text>

  <text x="240" y="98" font-family="system-ui, sans-serif" font-size="18" fill="#64748b">+</text>

  <rect x="280" y="58" width="400" height="200" rx="8" fill="#1e293b"/>
  <rect x="280" y="58" width="400" height="24" rx="8" fill="#334155"/>
  <text x="480" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Assembled prompt context (550 / 2000 tokens)</text>

  <text x="296" y="98" font-family="ui-monospace, monospace" font-size="8" fill="#38bdf8">[SOURCE c1 | handbook.pdf p.12]</text>
  <text x="296" y="112" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">Remote employees may work up to 3 days...</text>
  <text x="296" y="132" font-family="ui-monospace, monospace" font-size="8" fill="#38bdf8">[SOURCE c2 | handbook.pdf p.13]</text>
  <text x="296" y="146" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">Equipment stipend: $500 annually...</text>
  <text x="296" y="166" font-family="ui-monospace, monospace" font-size="8" fill="#38bdf8">[SOURCE c3 | benefits.docx PTO]</text>
  <text x="296" y="180" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">New hires accrue 15 PTO days...</text>

  <rect x="296" y="196" width="368" height="48" rx="4" fill="#0f172a" stroke="#ea580c"/>
  <text x="312" y="214" font-family="system-ui, sans-serif" font-size="8" fill="#ea580c">System: Answer ONLY from sources. Cite [c1], [c2]...</text>
  <text x="312" y="230" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">User: What is the remote work stipend?</text>

  <rect x="40" y="148" width="180" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="130" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">Budget rules</text>
  <text x="56" y="186" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Max 2000 tok retrieval</text>
  <text x="56" y="200" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Dedupe same source</text>
  <text x="56" y="214" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Trim longest last</text>
  <text x="56" y="228" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Never truncate mid-sentence</text>
  <text x="56" y="246" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Log tokens_used</text>

  <text x="360" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">LLM answer cites [c2] -- user clicks to verify handbook.pdf p.13</text>
</svg>
