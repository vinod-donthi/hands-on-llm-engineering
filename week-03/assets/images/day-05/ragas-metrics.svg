<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">RAGAS evaluation metrics dashboard</title>
  <desc id="desc">Faithfulness, context precision, context recall, and answer relevancy scores from RAGAS eval.</desc>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">RAGAS metrics</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Automated LLM-judge scores on golden dataset -- ship gate faithfulness &gt;= 0.75</text>

  <rect x="40" y="58" width="640" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="78" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">Aggregate scores (50 golden pairs)</text>

  <rect x="56" y="88" width="120" height="56" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="116" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Faithfulness</text>
  <text x="116" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#16a34a">0.82</text>

  <rect x="192" y="88" width="120" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="252" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Ctx precision</text>
  <text x="252" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#2563eb">0.78</text>

  <rect x="328" y="88" width="120" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="388" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Ctx recall</text>
  <text x="388" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#2563eb">0.74</text>

  <rect x="464" y="88" width="120" height="56" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="524" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Answer relevancy</text>
  <text x="524" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ea580c">0.81</text>

  <rect x="600" y="88" width="64" height="56" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="632" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Gate</text>
  <text x="632" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#16a34a">PASS</text>

  <rect x="40" y="172" width="300" height="88" rx="8" fill="#1e293b"/>
  <text x="56" y="192" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Golden pair g001</text>
  <text x="56" y="208" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">Q: remote work equipment stipend?</text>
  <text x="56" y="224" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">Truth: $500 annually for eligible remote...</text>
  <text x="56" y="244" font-family="ui-monospace, monospace" font-size="8" fill="#16a34a">faithfulness=0.95 ctx_recall=0.90</text>

  <rect x="360" y="172" width="320" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="376" y="192" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">What each metric catches</text>
  <text x="376" y="208" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Faithfulness: answer grounded in retrieved context</text>
  <text x="376" y="222" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Ctx precision: retrieved chunks are relevant</text>
  <text x="376" y="236" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Ctx recall: right chunk was retrieved</text>
  <text x="376" y="250" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Answer relevancy: response addresses the question</text>

  <text x="360" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Output: rag_eval_report.json -- per-sample breakdown + aggregates</text>
</svg>
