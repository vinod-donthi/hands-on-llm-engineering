<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">RAG failure modes debug decision tree</title>
  <desc id="desc">Symptom to layer to fix checklist for debugging RAG pipelines.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">RAG failure debug tree</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Symptom to layer to first check -- do not random-walk fixes</text>

  <rect x="260" y="54" width="200" height="36" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="360" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#9a3412">User symptom</text>

  <line x1="300" y1="90" x2="160" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="90" x2="360" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="90" x2="560" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="122" width="200" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="160" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#475569">Wrong fact, confident</text>
  <text x="160" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Check: context has truth?</text>

  <rect x="260" y="122" width="200" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="360" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#475569">I don&apos;t know (doc has answer)</text>
  <text x="360" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Check: BM25+dense hit@5</text>

  <rect x="460" y="122" width="200" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="560" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#475569">Wrong document cited</text>
  <text x="560" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Check: rerank top-5</text>

  <line x1="160" y1="170" x2="160" y2="192" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="170" x2="360" y2="192" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="170" x2="560" y2="192" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="196" width="160" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="160" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1d4ed8">Layer: Generation</text>
  <text x="160" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Tighten ONLY-use-sources</text>

  <rect x="280" y="196" width="160" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1d4ed8">Layer: Retrieval</text>
  <text x="360" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Enable hybrid + RRF</text>

  <rect x="480" y="196" width="160" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="560" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1d4ed8">Layer: Rerank</text>
  <text x="560" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Cross-encoder reorder</text>

  <rect x="40" y="256" width="640" height="52" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="56" y="276" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">Debug order: 1 Ingestion  2 Chunking  3 Retrieval  4 Rerank  5 Prompt</text>
  <text x="56" y="294" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Worked example: &quot;force majeure&quot; -- BM25 hits, dense misses -- hybrid fixes; log retrieved chunk_ids per request</text>
</svg>
