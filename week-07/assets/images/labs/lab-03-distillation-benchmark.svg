  <text x="56" y="268" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Estimated teacher gen cost: $1.20 (100 pairs)</text>

  <text x="360" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Deliverable: teacher vs student benchmark with routing recommendation</text>
