<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Advanced AI Studio architecture overview</title>
  <desc id="desc">FastAPI gateway routes Track A fine-tuned model or Track B LangGraph agentic RAG with Qdrant, Redis, MCP, and observability.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Advanced AI Studio architecture</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Week 7 capstone -- Track A or Track B per ADR</text>

  <rect x="280" y="58" width="160" height="40" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1d4ed8">Client / CLI</text>

  <line x1="360" y1="98" x2="360" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="120" width="240" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">FastAPI Gateway</text>
  <text x="360" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Redis rate limit + OTEL traces</text>

  <line x1="360" y1="168" x2="360" y2="188" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="190" width="160" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="360" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Track Router (A or B)</text>

  <line x1="280" y1="208" x2="160" y2="248" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="208" x2="560" y2="248" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="248" width="200" height="72" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="160" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">Track A: Fine-tuned</text>
  <text x="160" y="288" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">ft:gpt-4o-mini:...</text>
  <text x="160" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">routes/chat.py</text>

  <rect x="460" y="248" width="200" height="72" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="560" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#166534">Track B: Agentic RAG</text>
  <text x="560" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">LangGraph + grader loop</text>
  <text x="560" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">routes/agent.py</text>

  <rect x="40" y="332" width="120" height="24" rx="4" fill="#1e293b"/>
  <text x="100" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Qdrant (retrieve)</text>

  <rect x="180" y="332" width="120" height="24" rx="4" fill="#1e293b"/>
  <text x="240" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">MCP SSE tools</text>

  <rect x="320" y="332" width="120" height="24" rx="4" fill="#1e293b"/>
  <text x="380" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Langfuse / OTEL</text>

  <rect x="460" y="332" width="120" height="24" rx="4" fill="#1e293b"/>
  <text x="520" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Redis (limits)</text>

  <rect x="600" y="332" width="80" height="24" rx="4" fill="#1e293b"/>
  <text x="640" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">ADR</text>
</svg>
