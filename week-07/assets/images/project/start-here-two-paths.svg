<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Week 7 learning path vs work path and capstone tracks</title>
  <desc id="desc">Two folders for curriculum vs code, plus Track A fine-tuned assistant vs Track B agentic RAG capstone choice.</desc>
  <rect width="720" height="220" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Two folders + one capstone track</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Read in Learning repo; code in week-07-work with .venv and .env</text>

  <rect x="60" y="58" width="280" height="100" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="200" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Learning path</text>
  <text x="200" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#475569">week-07/</text>
  <text x="200" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">daily/, theory/, lab specs</text>
  <text x="200" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">No secrets, no .venv</text>

  <rect x="380" y="58" width="280" height="100" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="520" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">Work path</text>
  <text x="520" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#475569">week-07-work/</text>
  <text x="520" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">advanced-ai-studio/</text>
  <text x="520" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">.venv, .env, deliverables</text>

  <rect x="120" y="168" width="220" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="230" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1d4ed8">Track A: Fine-tuned assistant</text>
  <text x="230" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Locked style, high QPS</text>

  <rect x="380" y="168" width="220" height="40" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="490" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Track B: Agentic RAG</text>
  <text x="490" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Multi-hop docs, tools</text>
</svg>
