<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Lab 3 Redis cache and rate limit demo output</title>
  <desc id="desc">redis_cache_demo.json showing cache hit on second query and 429 count from burst traffic.</desc>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Lab 3: expected redis_cache_demo.json</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Second identical query hits cache; burst triggers HTTP 429</text>

  <rect x="40" y="58" width="640" height="220" rx="8" fill="#1e293b"/>
  <rect x="40" y="58" width="640" height="28" rx="8" fill="#334155"/>
  <circle cx="58" cy="72" r="5" fill="#ef4444"/>
  <circle cx="74" cy="72" r="5" fill="#f59e0b"/>
  <circle cx="90" cy="72" r="5" fill="#22c55e"/>
  <text x="360" y="76" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">python lab03_redis_cache_demo.py</text>

  <text x="56" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Request 1: &quot;What is our SLA?&quot;</text>
  <text x="72" y="122" font-family="ui-monospace, monospace" font-size="9" fill="#ea580c">cache_hit: false  latency_ms: 512  cost_usd: 0.004</text>
  <text x="56" y="142" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Request 2: &quot;What is our SLA?&quot; (identical)</text>
  <text x="72" y="160" font-family="ui-monospace, monospace" font-size="9" fill="#22c55e">cache_hit: true   latency_ms: 6    cost_usd: 0.000</text>
  <text x="56" y="180" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Burst: 70 requests in 10s</text>
  <text x="72" y="198" font-family="ui-monospace, monospace" font-size="9" fill="#ea580c">429_count: 23  allowed: 47  Retry-After header present</text>

  <rect x="56" y="210" width="608" height="56" rx="4" fill="#0f172a"/>
  <text x="72" y="230" font-family="ui-monospace, monospace" font-size="8" fill="#38bdf8">&quot;cache_demo&quot;: {&quot;first_latency_ms&quot;: 512, &quot;second_latency_ms&quot;: 6, &quot;cache_hit&quot;: true},</text>
  <text x="72" y="248" font-family="ui-monospace, monospace" font-size="8" fill="#16a34a">&quot;rate_limit&quot;: {&quot;total_requests&quot;: 70, &quot;blocked_429&quot;: 23, &quot;ttl_seconds&quot;: 300}</text>

  <text x="360" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Deliverable: exact cache + token bucket per X-API-Key</text>
</svg>
