<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Lab 1 health probe expected output</title>
  <desc id="desc">Terminal showing health_check_report.json with /health always 200 and /ready conditional on Redis.</desc>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Lab 1: expected health_check_report.json</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">/health always 200; /ready 200 only when dependencies reachable</text>

  <rect x="40" y="58" width="640" height="200" rx="8" fill="#1e293b"/>
  <rect x="40" y="58" width="640" height="28" rx="8" fill="#334155"/>
  <circle cx="58" cy="72" r="5" fill="#ef4444"/>
  <circle cx="74" cy="72" r="5" fill="#f59e0b"/>
  <circle cx="90" cy="72" r="5" fill="#22c55e"/>
  <text x="360" y="76" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">python lab01_health_probe.py</text>

  <text x="56" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#22c55e">GET /health  200  {&quot;status&quot;: &quot;ok&quot;}</text>
  <text x="56" y="124" font-family="ui-monospace, monospace" font-size="9" fill="#22c55e">GET /ready   200  {&quot;ready&quot;: true, &quot;checks&quot;: {&quot;redis&quot;: &quot;ok&quot;}}</text>
  <text x="56" y="144" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">X-Request-ID: req_a1b2c3d4 on every response</text>
  <text x="56" y="164" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Wrote health_check_report.json (5 probes each endpoint)</text>

  <rect x="56" y="176" width="608" height="72" rx="4" fill="#0f172a"/>
  <text x="72" y="196" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">{</text>
  <text x="88" y="212" font-family="ui-monospace, monospace" font-size="8" fill="#38bdf8">&quot;health&quot;: {&quot;status_code&quot;: 200, &quot;pass_rate&quot;: &quot;5/5&quot;},</text>
  <text x="88" y="228" font-family="ui-monospace, monospace" font-size="8" fill="#16a34a">&quot;ready&quot;: {&quot;status_code&quot;: 200, &quot;pass_rate&quot;: &quot;5/5&quot;, &quot;checks&quot;: {&quot;redis&quot;: &quot;ok&quot;}}</text>
  <text x="72" y="244" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">}</text>

  <text x="360" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Deliverable: lifespan + RequestIdMiddleware + structlog JSON logging</text>
</svg>
