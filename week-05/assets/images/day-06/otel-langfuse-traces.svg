<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">OpenTelemetry and Langfuse trace spans</title>
  <desc id="desc">RAG request trace shows nested spans with qdrant_search as 11.2s bottleneck in Langfuse UI.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">OpenTelemetry + Langfuse trace</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">One request journey -- which span failed and how long each step took</text>

  <rect x="40" y="58" width="400" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="78" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Trace: trace_9f2a (12.1s total)</text>

  <rect x="56" y="88" width="360" height="24" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="68" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#1d4ed8">rag_answer</text>
  <text x="400" y="104" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">12,100 ms</text>

  <rect x="72" y="120" width="80" height="20" rx="3" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="80" y="134" font-family="ui-monospace, monospace" font-size="8" fill="#166534">embed_query</text>
  <text x="148" y="134" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">180 ms</text>

  <rect x="72" y="148" width="280" height="20" rx="3" fill="#fef2f2" stroke="#dc2626"/>
  <text x="80" y="162" font-family="ui-monospace, monospace" font-size="8" fill="#991b1b">qdrant_search</text>
  <text x="348" y="162" font-family="ui-monospace, monospace" font-size="8" fill="#dc2626">11,200 ms</text>
  <text x="200" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#dc2626">bottleneck -- cold index, not LLM</text>

  <rect x="72" y="188" width="120" height="20" rx="3" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="80" y="202" font-family="ui-monospace, monospace" font-size="8" fill="#166534">llm_generate</text>
  <text x="188" y="202" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">620 ms</text>

  <rect x="56" y="220" width="360" height="28" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="68" y="238" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">metadata: cache_hit=false, chunks=3, request_id=req_7x9k</text>

  <line x1="444" y1="158" x2="468" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="470" y="58" width="210" height="200" rx="8" fill="#1e293b"/>
  <text x="575" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Langfuse UI</text>
  <rect x="486" y="88" width="178" height="24" rx="4" fill="#334155"/>
  <text x="575" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#e2e8f0">prompt + completion</text>
  <rect x="486" y="120" width="178" height="24" rx="4" fill="#334155"/>
  <text x="575" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#e2e8f0">token usage + cost</text>
  <rect x="486" y="152" width="178" height="24" rx="4" fill="#334155"/>
  <text x="575" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#e2e8f0">nested observations</text>
  <rect x="486" y="184" width="178" height="24" rx="4" fill="#334155"/>
  <text x="575" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#e2e8f0">user_id + scores</text>
  <text x="575" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">OTLP exporter or SDK direct</text>

  <rect x="40" y="272" width="640" height="36" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Logs = what happened | Metrics = averages | Traces = one request path</text>
  <text x="360" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">FastAPI auto-instrumentation + manual spans for retrieve and generate</text>
</svg>
