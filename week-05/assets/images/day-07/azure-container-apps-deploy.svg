<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Azure Container Apps deployment path</title>
  <desc id="desc">Docker Compose services map to Azure Container Apps environment with ACR images and managed Redis.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Compose to Azure Container Apps</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Same topology -- HTTPS URL, secrets vault, scale-to-zero</text>

  <rect x="40" y="58" width="280" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="180" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Docker Compose (local)</text>

  <rect x="56" y="90" width="100" height="28" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="106" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1d4ed8">api :8000</text>
  <rect x="164" y="90" width="100" height="28" rx="4" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="214" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">worker</text>
  <rect x="56" y="126" width="100" height="28" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="106" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">redis</text>
  <rect x="164" y="126" width="100" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="214" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">qdrant</text>

  <text x="180" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">docker compose up -d --build</text>
  <text x="180" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">.env --&gt; never commit</text>
  <text x="180" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">healthcheck + depends_on</text>

  <line x1="324" y1="148" x2="360" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="342" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">az acr build</text>

  <rect x="362" y="120" width="80" height="56" rx="6" fill="#1e293b"/>
  <text x="402" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">ACR</text>
  <text x="402" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">container images</text>

  <line x1="444" y1="148" x2="468" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="470" y="58" width="210" height="180" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="575" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">Container Apps env</text>

  <rect x="486" y="90" width="178" height="32" rx="4" fill="#ffffff" stroke="#2563eb"/>
  <text x="575" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1d4ed8">production-ai-api</text>
  <text x="575" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">ingress external, port 8000</text>

  <rect x="486" y="130" width="178" height="32" rx="4" fill="#ffffff" stroke="#16a34a"/>
  <text x="575" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">production-ai-worker</text>
  <text x="575" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">ingress internal, min replicas 1</text>

  <rect x="486" y="170" width="178" height="32" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="575" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#991b1b">Azure Cache for Redis</text>
  <text x="575" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">managed, secretref:redis-url</text>

  <rect x="486" y="210" width="178" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="575" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">scale: concurrentRequests &gt; 50</text>

  <rect x="40" y="252" width="640" height="56" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="360" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Secrets: .env values --&gt; Container Apps secrets + env var references</text>
  <text x="360" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">min-replicas 1, max-replicas 5 | AKS optional for GPU / service mesh depth</text>
  <text x="360" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Exact commands in project/azure.md</text>
</svg>
