<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Redis exact cache and token bucket rate limit</title>
  <desc id="desc">RAG query checks Redis cache for hits and token bucket enforces rate limits per API key.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Redis on the hot path: cache + rate limit</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Sub-millisecond reads for cross-request concerns</text>

  <rect x="40" y="58" width="320" height="220" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="78" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Exact cache (RAG answers)</text>

  <rect x="56" y="90" width="100" height="36" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="106" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1d4ed8">POST query</text>

  <line x1="156" y1="108" x2="180" y2="108" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="182" y="90" width="100" height="36" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="232" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">Redis GET</text>

  <text x="56" y="148" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a">HIT: cache:rag:8f3a2b... --&gt; 0.8ms, $0</text>
  <text x="56" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#ea580c">MISS: RAG pipeline --&gt; SET ex=300 TTL</text>

  <rect x="56" y="180" width="288" height="80" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="72" y="200" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">cache:rag:{sha256(query)}</text>
  <text x="72" y="216" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">ratelimit:{client_id}:{window}</text>
  <text x="72" y="232" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">session:{session_id}</text>
  <text x="72" y="248" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">job:{job_id}</text>

  <rect x="380" y="58" width="300" height="220" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="396" y="78" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Token bucket rate limit</text>

  <rect x="396" y="90" width="268" height="48" rx="4" fill="#fff7ed" stroke="#ea580c"/>
  <text x="530" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#9a3412">Bucket: 10 tokens (burst)</text>
  <text x="530" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Refill: 1 token/sec (= 60/min sustained)</text>

  <rect x="396" y="150" width="120" height="32" rx="4" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="456" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">tokens &gt;= 1</text>
  <text x="456" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">allow, decrement</text>

  <rect x="544" y="150" width="120" height="32" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="604" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">tokens &lt; 1</text>
  <text x="604" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">HTTP 429 Retry-After</text>

  <text x="530" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Per X-API-Key or IP via Redis INCR + EXPIRE</text>
  <text x="530" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">200 req/min abuse --&gt; blocked at 60/min tier</text>

  <text x="360" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Prefix all keys -- one Redis instance, many apps, no collisions</text>
</svg>
