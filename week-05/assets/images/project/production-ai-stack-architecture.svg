<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Production AI Stack architecture overview</title>
  <desc id="desc">Clients connect to FastAPI in Docker Compose with Redis, worker, Qdrant, OpenAI, and Langfuse.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Production AI Stack architecture</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Week 5 project -- hardened RAG with cache, workers, and traces</text>

  <rect x="40" y="58" width="640" height="52" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Clients</text>
  <text x="200" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Web / CLI (sync RAG)</text>
  <text x="520" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Batch (async jobs)</text>

  <line x1="360" y1="110" x2="360" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="130" width="640" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">FastAPI api :8000</text>
  <rect x="56" y="160" width="88" height="28" rx="4" fill="#fff7ed" stroke="#ea580c"/>
  <text x="100" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9a3412">RequestID</text>
  <rect x="152" y="160" width="88" height="28" rx="4" fill="#fff7ed" stroke="#ea580c"/>
  <text x="196" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9a3412">RateLimit</text>
  <rect x="248" y="160" width="72" height="28" rx="4" fill="#fff7ed" stroke="#ea580c"/>
  <text x="284" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9a3412">CostCap</text>
  <rect x="328" y="160" width="100" height="28" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="378" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1d4ed8">SemanticCache</text>
  <rect x="436" y="160" width="88" height="28" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="480" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1d4ed8">ExactCache</text>
  <rect x="532" y="160" width="88" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="576" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">RAG pipeline</text>
  <rect x="56" y="198" width="88" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="100" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">/health /ready</text>
  <rect x="152" y="198" width="88" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="196" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">Job enqueue</text>
  <rect x="248" y="198" width="88" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="292" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">Langfuse trace</text>

  <line x1="200" y1="250" x2="120" y2="278" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="250" x2="360" y2="278" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="250" x2="600" y2="278" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="280" width="120" height="44" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="100" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">redis :6379</text>
  <text x="100" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">cache + queue</text>

  <rect x="300" y="280" width="120" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="360" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">worker (ARQ)</text>
  <text x="360" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">async RAG + cron</text>

  <rect x="560" y="280" width="120" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="620" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">qdrant :6333</text>
  <text x="620" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">vectors (optional)</text>

  <line x1="100" y1="324" x2="100" y2="340" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="360" y1="324" x2="360" y2="340" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="180" y="340" width="120" height="32" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="240" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">OpenAI API</text>

  <rect x="420" y="340" width="120" height="32" rx="6" fill="#1e293b"/>
  <text x="480" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Langfuse</text>

  <text x="360" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Work dir: ~/ai-learning/week-05-work/production-ai-stack/</text>
</svg>
