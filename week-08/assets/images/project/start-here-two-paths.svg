<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Week 8 learning path vs work path</title>
  <desc id="desc">Two folders: week-08 curriculum markdown vs week-08-work ai-radar code and secrets.</desc>
  <rect width="720" height="220" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Two folders -- do not mix them</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Read in Learning repo; code in week-08-work with .venv and .env</text>

  <rect x="60" y="58" width="280" height="130" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="200" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Learning path</text>
  <text x="200" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#475569">week-08/</text>
  <text x="200" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Markdown only</text>
  <text x="200" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">daily/, theory/, project specs</text>
  <text x="200" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">No secrets, no .venv</text>
  <text x="200" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Open daily/day-01.md first</text>

  <rect x="380" y="58" width="280" height="130" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="520" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">Work path</text>
  <text x="520" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#475569">week-08-work/</text>
  <text x="520" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">ai-radar/ monorepo</text>
  <text x="520" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">.venv, .env, deliverables</text>
  <text x="520" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Docker, eval artifacts</text>
  <text x="520" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Never commit .env</text>

  <text x="360" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Four phases, seven days -- follow daily playbook steps 1 to N</text>
</svg>
