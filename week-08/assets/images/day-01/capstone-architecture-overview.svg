<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">AI Radar capstone four-layer architecture</title>
  <desc id="desc">Four layers: Collect ingestion, Remember pgvector, Reason LangGraph agent, Deliver dashboard and email with eval CI.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">AI Radar capstone -- four layers</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Week 8 integrates ingestion, retrieval, agents, UI, and eval gates</text>

  <line x1="148" y1="88" x2="168" y2="88" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="308" y1="88" x2="328" y2="88" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="468" y1="88" x2="488" y2="88" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="58" width="108" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="94" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">1. Collect</text>
  <text x="94" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">RSS + GitHub</text>
  <text x="94" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">scheduled fetch</text>

  <rect x="176" y="58" width="132" height="64" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="242" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">2. Remember</text>
  <text x="242" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Postgres + pgvector</text>
  <text x="242" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">hybrid retrieval</text>

  <rect x="336" y="58" width="132" height="64" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="402" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9a3412">3. Reason</text>
  <text x="402" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">LangGraph + MCP</text>
  <text x="402" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">agentic RAG</text>

  <rect x="496" y="58" width="184" height="64" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="588" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">4. Deliver</text>
  <text x="588" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Next.js + email digest</text>
  <text x="588" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">RAGAS CI gate</text>

  <rect x="40" y="148" width="640" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">End-to-end data path</text>

  <rect x="56" y="182" width="88" height="28" rx="4" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="100" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">Celery Beat</text>
  <line x1="144" y1="196" x2="162" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="170" y="182" width="88" height="28" rx="4" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="214" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">Ingestion</text>
  <line x1="258" y1="196" x2="276" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="284" y="182" width="88" height="28" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="328" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#1d4ed8">pgvector</text>
  <line x1="372" y1="196" x2="390" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="398" y="182" width="88" height="28" rx="4" fill="#fff7ed" stroke="#ea580c"/>
  <text x="442" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9a3412">LangGraph</text>
  <line x1="486" y1="196" x2="504" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="512" y="182" width="88" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="556" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">Dashboard</text>

  <rect x="56" y="224" width="120" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="116" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">Redis semantic cache</text>
  <text x="240" y="242" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">short-circuits repeat queries</text>

  <rect x="400" y="224" width="120" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="460" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">RAGAS CI gate</text>
  <text x="560" y="242" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">blocks regressions</text>

  <text x="360" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Phases 1-4 map to Days 1-7 -- draw this before coding Day 1</text>
</svg>
