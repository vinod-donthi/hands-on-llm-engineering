<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph capstone agent flow</title>
  <desc id="desc">Plan node routes to tool router and agentic RAG, critique loops back if insufficient, then synthesize produces cited answer.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">LangGraph capstone flow</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Stateful nodes with checkpointing -- max 3 critique loops</text>

  <rect x="300" y="58" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">plan</text>

  <line x1="360" y1="98" x2="360" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="122" width="120" height="40" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="360" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9a3412">tool_router</text>

  <line x1="300" y1="142" x2="180" y2="142" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="142" x2="540" y2="142" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="122" width="120" height="40" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="120" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">MCP tools</text>
  <text x="120" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">search, github</text>

  <rect x="540" y="122" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="600" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1d4ed8">agentic_rag</text>
  <text x="600" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">pgvector retrieve</text>

  <line x1="120" y1="162" x2="120" y2="200" stroke="#64748b" stroke-width="1.5"/>
  <line x1="600" y1="162" x2="600" y2="200" stroke="#64748b" stroke-width="1.5"/>
  <line x1="120" y1="200" x2="600" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="204" width="120" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="360" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#92400e">critique</text>

  <path d="M 240 224 L 200 224 L 200 142 L 288 142" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="188" y="188" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">not sufficient</text>

  <line x1="360" y1="244" x2="360" y2="268" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="260" font-family="system-ui, sans-serif" font-size="8" fill="#16a34a">sufficient</text>

  <rect x="280" y="272" width="160" height="48" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="360" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">synthesize</text>
  <text x="360" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">markdown + citations</text>

  <rect x="40" y="336" width="640" height="32" rx="4" fill="#1e293b"/>
  <text x="56" y="356" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">AgentState: query, plan, messages, retrieved_docs, tool_calls, final_answer</text>
</svg>
