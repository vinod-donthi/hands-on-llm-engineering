<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">RAGAS eval CI gate workflow</title>
  <desc id="desc">Pull request triggers GitHub Actions RAGAS eval, compares to baseline, and fails if faithfulness drops more than 5 percent.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Eval CI gate -- RAGAS on every PR</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Blocks merges when faithfulness drops &gt; 5% vs baseline</text>

  <rect x="40" y="70" width="100" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="90" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">PR opened</text>
  <text x="90" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">prompt change</text>

  <line x1="140" y1="92" x2="168" y2="92" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="176" y="70" width="120" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="236" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1d4ed8">GitHub Actions</text>
  <text x="236" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">eval-gate.yml</text>

  <line x1="296" y1="92" x2="324" y2="92" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="332" y="58" width="140" height="68" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="402" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#9a3412">RAGAS eval</text>
  <text x="402" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">10 golden questions</text>
  <text x="402" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">config/eval_golden.yaml</text>
  <text x="402" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">mode: rag_only on PR</text>

  <line x1="472" y1="92" x2="500" y2="92" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="508" y="70" width="120" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="568" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#92400e">Compare baseline</text>
  <text x="568" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">rag_eval_baseline.json</text>

  <line x1="628" y1="92" x2="656" y2="92" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="664" y="78" width="36" height="28" rx="4" fill="#fef2f2" stroke="#ef4444"/>
  <text x="682" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#b91c1c">X</text>

  <rect x="40" y="140" width="640" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="360" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">RAGAS metrics</text>

  <rect x="56" y="172" width="180" height="52" rx="4" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="146" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Faithfulness</text>
  <text x="146" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Answer supported by context?</text>
  <text x="146" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#b91c1c">0.82 -&gt; 0.71 FAIL</text>

  <rect x="252" y="172" width="180" height="52" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="342" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1d4ed8">Context precision</text>
  <text x="342" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Relevant chunks retrieved?</text>

  <rect x="448" y="172" width="180" height="52" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="538" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569">Answer relevance</text>
  <text x="538" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Addresses the question?</text>

  <rect x="40" y="256" width="300" height="48" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="190" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#b91c1c">CI FAIL</text>
  <text x="190" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Regression &gt; EVAL_REGRESSION_MAX_PCT (5%)</text>

  <rect x="380" y="256" width="300" height="48" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="530" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#166534">CI PASS</text>
  <text x="530" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Metrics within threshold -- merge allowed</text>

  <text x="360" y="314" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Commit green baseline locally -- badge in README shows status</text>
</svg>
