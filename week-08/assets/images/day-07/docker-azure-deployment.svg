<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Docker Compose local to Azure deployment path</title>
  <desc id="desc">Local docker compose with postgres, redis, backend, worker, frontend; optional Azure Container Apps path with managed Postgres and Redis.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Docker local -- optional Azure deploy</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">docker compose up -- reproduces capstone in ~3 minutes</text>

  <rect x="40" y="58" width="300" height="220" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="190" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Docker Compose (required)</text>
  <text x="190" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">docker compose up</text>

  <rect x="56" y="108" width="120" height="32" rx="4" fill="#1e293b"/>
  <text x="116" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">postgres</text>
  <rect x="188" y="108" width="120" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="248" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">redis</text>

  <line x1="116" y1="140" x2="116" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="154" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">healthy first</text>

  <rect x="56" y="164" width="120" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="116" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">backend</text>
  <rect x="188" y="164" width="120" height="32" rx="4" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="248" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#166534">worker</text>

  <line x1="116" y1="196" x2="116" y2="216" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="220" width="120" height="32" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="180" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1d4ed8">frontend :3000</text>

  <text x="190" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">localhost demo -- $0 cost</text>

  <line x1="340" y1="168" x2="368" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="354" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">optional</text>

  <rect x="380" y="58" width="300" height="220" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="530" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">Azure (optional)</text>
  <text x="530" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Not required for Week 8 exit</text>

  <rect x="396" y="112" width="268" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="530" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Azure Container Apps</text>

  <rect x="396" y="152" width="128" height="32" rx="4" fill="#1e293b"/>
  <text x="460" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Flexible Postgres</text>
  <rect x="536" y="152" width="128" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="600" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#92400e">Azure Cache Redis</text>

  <rect x="396" y="196" width="268" height="32" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="530" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1d4ed8">Public HTTPS URL</text>

  <text x="530" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">$45-70/mo if left running</text>
  <text x="530" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">+ half day setup</text>

  <rect x="40" y="296" width="640" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="360" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Health dependency order</text>
  <text x="80" y="334" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">postgres healthy</text>
  <text x="200" y="334" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">-&gt; backend</text>
  <text x="280" y="334" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">-&gt; frontend</text>
  <text x="380" y="334" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">| redis up</text>
  <text x="460" y="334" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">-&gt; worker starts</text>
</svg>
