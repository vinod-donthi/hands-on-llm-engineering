  <text x="72" y="216" font-family="ui-monospace, monospace" font-size="9" fill="#22c55e">PASS: faithfulness 0.82 -- context_precision 0.78</text>
  <text x="72" y="232" font-family="ui-monospace, monospace" font-size="8" fill="#86efac">PR #43 -- revert -- badge green in README</text>

  <text x="56" y="262" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Estimated cost: $1-2 per CI run</text>

  <text x="360" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Deliverable: workflow on PR -- intentional regression fails -- revert passes</text>
