<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Lab 5 Redis semantic cache hit report</title>
  <desc id="desc">Terminal showing query A miss at 3800ms and query B paraphrase cache hit at 210ms with similarity 0.93.</desc>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Lab 5: expected cache_hit_report.json</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Paraphrased query returns faster with cache_hit true</text>

  <rect x="40" y="58" width="640" height="220" rx="8" fill="#1e293b"/>
  <rect x="40" y="58" width="640" height="28" rx="8" fill="#334155"/>
  <circle cx="58" cy="72" r="5" fill="#ef4444"/>
  <circle cx="74" cy="72" r="5" fill="#f59e0b"/>
  <circle cx="90" cy="72" r="5" fill="#22c55e"/>
  <text x="360" y="76" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">python lab05_cache_hit.py</text>

  <text x="56" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Query A: &quot;What embedding models were released recently?&quot;</text>
  <text x="72" y="120" font-family="ui-monospace, monospace" font-size="9" fill="#ea580c">latency 3800ms -- cache_hit false -- cost $0.018</text>
  <text x="56" y="144" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Query B: &quot;Recent embedding model releases&quot;</text>
  <text x="72" y="160" font-family="ui-monospace, monospace" font-size="9" fill="#22c55e">latency 210ms -- cache_hit true -- cost $0.0001</text>
  <text x="56" y="180" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">similarity_score: 0.93 -- threshold: 0.92</text>
  <text x="56" y="198" font-family="ui-monospace, monospace" font-size="9" fill="#16a34a">Query B latency &lt; 20% of Query A -- PASS</text>

  <rect x="56" y="210" width="608" height="56" rx="4" fill="#0f172a"/>
  <text x="72" y="230" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8">{ &quot;query_a&quot;: { &quot;latency_ms&quot;: 3800, &quot;cache_hit&quot;: false },</text>
  <text x="88" y="246" font-family="ui-monospace, monospace" font-size="8" fill="#38bdf8">&quot;query_b&quot;: { &quot;latency_ms&quot;: 210, &quot;cache_hit&quot;: true },</text>
  <text x="88" y="258" font-family="ui-monospace, monospace" font-size="8" fill="#16a34a">&quot;similarity_score&quot;: 0.93, &quot;threshold&quot;: 0.92 }</text>

  <text x="360" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Deliverable: semantic cache cuts cost on paraphrased dashboard queries</text>
</svg>
