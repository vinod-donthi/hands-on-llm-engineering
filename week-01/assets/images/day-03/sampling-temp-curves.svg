<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Temperature sharpens or flattens token probabilities</title>
  <desc id="desc">Same logits after temperature 0 (one sharp peak) vs temperature 1.2 (flatter distribution with higher tail risk).</desc>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Same logits, different temperature</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Lower T = winner takes all; higher T = underdog tokens get picked more often</text>

  <!-- Shared chart geometry: plot top 76, baseline 188, bar width 36, gap 28 -->
  <!-- LEFT chart frame x=48 w=280 -->
  <text x="188" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">temperature = 0 (greedy)</text>
  <rect x="48" y="76" width="280" height="28" fill="#f1f5f9"/>
  <line x1="48" y1="76" x2="48" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="48" y1="188" x2="328" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="328" y1="76" x2="328" y2="188" stroke="#cbd5e1"/>

  <!-- Left bars: centers 108, 164, 220 -->
  <rect x="90" y="183" width="36" height="5" fill="#e2e8f0"/>
  <text x="108" y="177" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">3%</text>
  <text x="108" y="204" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">A</text>

  <rect x="146" y="175" width="36" height="13" fill="#e2e8f0"/>
  <text x="164" y="169" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">7%</text>
  <text x="164" y="204" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">B</text>

  <rect x="202" y="108" width="36" height="80" fill="#2563eb"/>
  <text x="220" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#1d4ed8">90%</text>
  <text x="220" y="204" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#2563eb">C (picked)</text>

  <!-- RIGHT chart frame x=392 w=280 -->
  <text x="532" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c2410c">temperature = 1.2</text>
  <rect x="392" y="76" width="280" height="28" fill="#f1f5f9"/>
  <line x1="392" y1="76" x2="392" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="392" y1="188" x2="672" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="672" y1="76" x2="672" y2="188" stroke="#cbd5e1"/>

  <!-- Right bars: centers 452, 508, 564, 620 -->
  <rect x="434" y="170" width="36" height="18" fill="#93c5fd"/>
  <text x="452" y="164" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#1d4ed8">22%</text>
  <text x="452" y="204" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">A</text>

  <rect x="490" y="162" width="36" height="26" fill="#93c5fd"/>
  <text x="508" y="156" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#1d4ed8">28%</text>
  <text x="508" y="204" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">B</text>

  <rect x="546" y="154" width="36" height="34" fill="#2563eb"/>
  <text x="564" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#1d4ed8">35%</text>
  <text x="564" y="204" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">C</text>

  <rect x="602" y="176" width="36" height="12" fill="#fed7aa"/>
  <text x="620" y="170" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#c2410c">15%</text>
  <text x="620" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ea580c">tail</text>

  <!-- Footer -->
  <rect x="80" y="218" width="560" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1a1a1a">High temperature: more varied runs, more fabricated specifics -- verify facts</text>
</svg>
