<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">KV cache grows across decode steps</title>
  <desc id="desc">Three decode steps show cached keys and values reused; only the new token is computed each step.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">KV cache: reuse prior attention, compute only the new token</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Without cache, step 50 would re-process tokens 1-49 from scratch</text>

  <!-- Step 1 -->
  <text x="120" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">Step 1</text>
  <rect x="40" y="78" width="160" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="120" y="98" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#475569">prompt ... rain.</text>
  <text x="120" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb">predicts: Soft</text>

  <rect x="40" y="132" width="160" height="56" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="120" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">KV cache</text>
  <rect x="52" y="160" width="36" height="18" rx="3" fill="#bbf7d0"/>
  <text x="70" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#166534">Soft</text>

  <line x1="210" y1="130" x2="248" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <text x="320" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">Step 2</text>
  <rect x="260" y="78" width="120" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="98" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1d4ed8">+ gray</text>
  <text x="320" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">new token only</text>

  <rect x="240" y="132" width="160" height="56" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="320" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">KV cache (reuse)</text>
  <rect x="252" y="160" width="36" height="18" rx="3" fill="#bbf7d0"/>
  <text x="270" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#166534">Soft</text>
  <rect x="292" y="160" width="36" height="18" rx="3" fill="#86efac"/>
  <text x="310" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" fill="#166534">gray</text>
  <text x="360" y="172" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">cached</text>

  <line x1="410" y1="130" x2="448" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <text x="520" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">Step 3</text>
  <rect x="460" y="78" width="120" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="520" y="98" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1d4ed8">+ clouds</text>
  <text x="520" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">new token only</text>

  <rect x="440" y="132" width="160" height="56" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="520" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">KV cache grows</text>
  <rect x="452" y="160" width="30" height="18" rx="3" fill="#bbf7d0"/>
  <text x="467" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="6" fill="#166534">Soft</text>
  <rect x="486" y="160" width="30" height="18" rx="3" fill="#bbf7d0"/>
  <text x="501" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="6" fill="#166534">gray</text>
  <rect x="520" y="160" width="36" height="18" rx="3" fill="#86efac"/>
  <text x="538" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="6" fill="#166534">clouds</text>

  <!-- Compare without cache -->
  <rect x="80" y="210" width="260" height="72" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="210" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#b91c1c">Without KV cache</text>
  <text x="210" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Step N re-runs attention over all N-1 tokens</text>
  <text x="210" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Correct but O(n^2) per decode step</text>

  <rect x="380" y="210" width="260" height="72" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="510" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#166534">With KV cache</text>
  <text x="510" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Prior K/V stored in GPU memory</text>
  <text x="510" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Tradeoff: longer context = more RAM</text>
</svg>
