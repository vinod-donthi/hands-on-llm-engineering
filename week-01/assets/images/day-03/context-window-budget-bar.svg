<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">Context window token budget breakdown</title>
  <desc id="desc">Full 128K bar with 28K planned (including safety margin) and 100K headroom; inset breakdown bar shows each component at readable scale.</desc>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">128K context window: one request budget (worked example)</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Input and output share the same desk -- reserve max_tokens before you fill the rest</text>

  <!-- Full-scale bar: 560px = 128,000 tokens -->
  <text x="80" y="62" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Full window (128K)</text>
  <rect x="80" y="68" width="560" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="84" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">0</text>
  <text x="640" y="84" text-anchor="end" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">128,000 limit</text>

  <!-- 28K used = 122.5px; 100K free = 437.5px -->
  <rect x="80" y="96" width="123" height="32" rx="3" fill="#6366f1"/>
  <text x="141" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ffffff">28K planned</text>
  <rect x="203" y="96" width="437" height="32" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="421" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">100K headroom</text>

  <text x="141" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">28,000 tokens used</text>
  <text x="421" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">unused capacity</text>

  <!-- Breakdown bar (560px = 28,000 tokens, readable labels) -->
  <text x="80" y="168" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Breakdown of 28K planned</text>
  <rect x="80" y="174" width="560" height="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- widths: 500, 8000, 15000, 4000, 500 out of 28000 -->
  <rect x="80" y="174" width="10" height="24" fill="#94a3b8"/>
  <rect x="90" y="174" width="160" height="24" fill="#6366f1"/>
  <rect x="250" y="174" width="300" height="24" fill="#2563eb"/>
  <rect x="550" y="174" width="80" height="24" fill="#ea580c"/>
  <rect x="630" y="174" width="10" height="24" fill="#fbbf24"/>

  <!-- Labels centered under each segment -->
  <text x="85" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">system</text>
  <text x="85" y="224" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">500</text>

  <text x="170" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">history</text>
  <text x="170" y="224" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">8K</text>

  <text x="400" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">user + notes</text>
  <text x="400" y="224" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">15K</text>

  <text x="590" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#c2410c">max_tokens</text>
  <text x="590" y="224" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#ea580c">4K</text>

  <text x="635" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#92400e">margin</text>
  <text x="635" y="224" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#b45309">500</text>

  <!-- Totals -->
  <rect x="80" y="236" width="560" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="96" y="254" font-family="system-ui, sans-serif" font-size="10" fill="#1a1a1a">Planned total: 28,000 tokens (23.5K input + 4K output + 500 margin)</text>
  <text x="96" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">128,000 - 28,000 = 100,000 tokens remaining</text>
  <text x="96" y="282" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a">You are fine for this request</text>

  <!-- Formula -->
  <text x="360" y="304" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#475569">max_input = context_limit - max_output - system - safety_margin</text>
  <text x="360" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Always count system prompt and chat history -- they are sent every call</text>

  <!-- Legend -->
  <rect x="132" y="330" width="8" height="8" fill="#94a3b8"/>
  <text x="144" y="338" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">system</text>
  <rect x="182" y="330" width="8" height="8" fill="#6366f1"/>
  <text x="194" y="338" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">history</text>
  <rect x="232" y="330" width="8" height="8" fill="#2563eb"/>
  <text x="244" y="338" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">user</text>
  <rect x="272" y="330" width="8" height="8" fill="#ea580c"/>
  <text x="284" y="338" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">output</text>
  <rect x="322" y="330" width="8" height="8" fill="#fbbf24"/>
  <text x="334" y="338" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">margin</text>
  <rect x="372" y="330" width="8" height="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="384" y="338" font-family="system-ui, sans-serif" font-size="7" fill="#64748b">free</text>
</svg>
