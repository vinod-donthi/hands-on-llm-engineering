<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Weak vs strong system prompt comparison</title>
  <desc id="desc">Vague Summarize this prompt vs structured rules with refusal and format constraints.</desc>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Weak vs strong prompt (same document)</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Small wording changes -- very different output quality and hallucination risk</text>

  <!-- Weak -->
  <text x="180" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">Weak</text>
  <rect x="40" y="70" width="280" height="56" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="56" y="92" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Summarize this.</text>
  <text x="56" y="110" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">{{ huge document }}</text>

  <rect x="40" y="136" width="280" height="72" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="156" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Random length, may invent</text>
  <text x="56" y="172" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">stats, no consistent format</text>
  <text x="180" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#b91c1c">Unpredictable</text>

  <!-- Strong -->
  <text x="540" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">Strong</text>
  <rect x="400" y="70" width="280" height="100" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="416" y="88" font-family="ui-monospace, monospace" font-size="8" fill="#166534">SYSTEM: Max 5 bullets</text>
  <text x="416" y="102" font-family="ui-monospace, monospace" font-size="8" fill="#166534">If no revenue, say Not stated</text>
  <text x="416" y="116" font-family="ui-monospace, monospace" font-size="8" fill="#166534">Do not invent statistics</text>
  <text x="416" y="134" font-family="ui-monospace, monospace" font-size="8" fill="#64748b">USER: Summarize doc...</text>

  <rect x="400" y="180" width="280" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="416" y="200" font-family="system-ui, sans-serif" font-size="9" fill="#475569">- Bullet 1...</text>
  <text x="416" y="216" font-family="system-ui, sans-serif" font-size="9" fill="#475569">- Revenue: Not stated in doc</text>
  <text x="540" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a">Structured + safer</text>

  <text x="360" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Version prompts in git; log prompt version with request_id (Week 2)</text>
</svg>
