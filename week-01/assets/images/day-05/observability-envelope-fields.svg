<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Observability envelope fields annotated</title>
  <desc id="desc">JSON log line with request_id, tokens, cost, latency, error, and parse_status highlighted.</desc>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Observability envelope -- same shape on success and failure</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Generate request_id at the API boundary; log structured JSON every call</text>

  <rect x="40" y="58" width="640" height="180" rx="8" fill="#1e293b"/>
  <text x="56" y="80" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">{</text>
  <text x="72" y="98" font-family="ui-monospace, monospace" font-size="10" fill="#e2e8f0">  &quot;request_id&quot;: </text>
  <text x="200" y="98" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8">&quot;550e...:gpt-4o-mini&quot;</text>
  <text x="72" y="116" font-family="ui-monospace, monospace" font-size="10" fill="#e2e8f0">  &quot;input_tokens&quot;: </text>
  <text x="210" y="116" font-family="ui-monospace, monospace" font-size="10" fill="#4ade80">42</text>
  <text x="72" y="134" font-family="ui-monospace, monospace" font-size="10" fill="#e2e8f0">  &quot;output_tokens&quot;: </text>
  <text x="220" y="134" font-family="ui-monospace, monospace" font-size="10" fill="#4ade80">28</text>
  <text x="72" y="152" font-family="ui-monospace, monospace" font-size="10" fill="#e2e8f0">  &quot;latency_ms&quot;: </text>
  <text x="200" y="152" font-family="ui-monospace, monospace" font-size="10" fill="#fde047">842.3</text>
  <text x="72" y="170" font-family="ui-monospace, monospace" font-size="10" fill="#e2e8f0">  &quot;cost_usd&quot;: </text>
  <text x="180" y="170" font-family="ui-monospace, monospace" font-size="10" fill="#fb923c">0.000031</text>
  <text x="72" y="188" font-family="ui-monospace, monospace" font-size="10" fill="#e2e8f0">  &quot;error&quot;: </text>
  <text x="150" y="188" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">null</text>
  <text x="72" y="206" font-family="ui-monospace, monospace" font-size="10" fill="#e2e8f0">  &quot;parse_status&quot;: </text>
  <text x="220" y="206" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc">null</text>
  <text x="56" y="224" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">}</text>

  <!-- Annotations on right -->
  <line x1="480" y1="98" x2="520" y2="98" stroke="#38bdf8" stroke-width="1"/>
  <text x="528" y="102" font-family="system-ui, sans-serif" font-size="8" fill="#38bdf8">correlate logs</text>

  <line x1="240" y1="152" x2="520" y2="152" stroke="#fde047" stroke-width="1"/>
  <text x="528" y="156" font-family="system-ui, sans-serif" font-size="8" fill="#eab308">debug slowness</text>

  <line x1="240" y1="170" x2="520" y2="170" stroke="#fb923c" stroke-width="1"/>
  <text x="528" y="174" font-family="system-ui, sans-serif" font-size="8" fill="#ea580c">finance</text>

  <rect x="80" y="252" width="560" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">On failure: same fields, error set, text may be empty -- still return the envelope</text>
</svg>
