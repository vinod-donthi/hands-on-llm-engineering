<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">Token counts compared across GPT and Llama tokenizers</title>
  <desc id="desc">Grouped bar chart comparing GPT and Llama token counts for prose, JSON, and code strings.</desc>
  <rect width="720" height="340" fill="#fafafa"/>

  <!-- Document title (outside chart frame) -->
  <text x="360" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Same string, different tokenizers (illustrative counts)</text>
  <text x="360" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Run Lab 1 for your own numbers; JSON/code deltas often exceed 15%</text>

  <!-- Chart frame: y-axis spans category header + plot (y=58 to y=268) -->
  <rect x="80" y="58" width="520" height="50" fill="#f1f5f9" stroke="none"/>
  <line x1="80" y1="58" x2="600" y2="58" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="80" y1="108" x2="600" y2="108" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="80" y1="58" x2="80" y2="268" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="600" y1="58" x2="600" y2="268" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="80" y1="268" x2="600" y2="268" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="280" y1="58" x2="280" y2="268" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="440" y1="58" x2="440" y2="268" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Category labels (inside chart header) -->
  <text x="180" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">&quot;Hello, world!&quot;</text>

  <text x="360" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">JSON snippet</text>
  <text x="360" y="94" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">{&quot;key&quot;:&quot;value&quot;}</text>

  <text x="520" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">Python function</text>
  <text x="520" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">def fibonacci(n): ...</text>

  <!-- Y-axis grid + labels (plot area only, 0-18 tokens, baseline y=268) -->
  <line x1="80" y1="215" x2="600" y2="215" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="162" x2="600" y2="162" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="112" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">18</text>
  <text x="72" y="166" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">12</text>
  <text x="72" y="219" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">6</text>
  <text x="72" y="272" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">0</text>
  <text x="40" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" transform="rotate(-90 40 188)">tokens</text>

  <!-- Bars: bottom anchored at y=268 (scale 160px / 18 tokens) -->
  <!-- Hello, world! -->
  <rect x="152" y="232" width="28" height="36" rx="2" fill="#2563eb"/>
  <rect x="184" y="224" width="28" height="44" rx="2" fill="#93c5fd"/>
  <text x="166" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af">4</text>
  <text x="198" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">5</text>
  <text x="180" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">GPT / Llama</text>

  <!-- JSON -->
  <rect x="332" y="188" width="28" height="80" rx="2" fill="#2563eb"/>
  <rect x="364" y="179" width="28" height="89" rx="2" fill="#93c5fd"/>
  <text x="346" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af">9</text>
  <text x="378" y="173" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">10</text>
  <text x="360" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">GPT / Llama</text>

  <!-- Code -->
  <rect x="492" y="170" width="28" height="98" rx="2" fill="#2563eb"/>
  <rect x="524" y="161" width="28" height="107" rx="2" fill="#93c5fd"/>
  <text x="506" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af">11</text>
  <text x="538" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">12</text>
  <text x="520" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">GPT / Llama</text>

  <!-- Callout -->
  <rect x="620" y="148" width="88" height="72" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="664" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#c2410c">Code / JSON</text>
  <text x="664" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9a3412">about 2x prose</text>
  <text x="664" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9a3412">Lab 1: 15%+</text>
  <text x="664" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9a3412">delta on code</text>

  <!-- Legend -->
  <rect x="24" y="308" width="16" height="12" rx="2" fill="#2563eb"/>
  <text x="46" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">GPT-4o Mini (tiktoken)</text>
  <rect x="200" y="308" width="16" height="12" rx="2" fill="#93c5fd"/>
  <text x="222" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Llama 3.1 (SentencePiece)</text>
</svg>
