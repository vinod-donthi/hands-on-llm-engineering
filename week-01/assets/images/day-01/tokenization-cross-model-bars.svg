<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Token counts compared across GPT and Llama tokenizers</title>
  <desc id="desc">Illustrative bar chart: same strings produce different token counts; JSON and code use more tokens than plain English.</desc>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Same string, different tokenizers  illustrative counts</text>
  <text x="360" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Run Lab 1 for your own numbers; JSON/code deltas often exceed 15%</text>

  <!-- Y axis -->
  <line x1="80" y1="70" x2="80" y2="240" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="80" y1="240" x2="680" y2="240" stroke="#cbd5e1" stroke-width="1"/>
  <text x="72" y="74" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">18</text>
  <text x="72" y="124" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">12</text>
  <text x="72" y="174" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">6</text>
  <text x="72" y="244" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">0</text>
  <text x="40" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" transform="rotate(-90 40 155)">tokens</text>

  <!-- Group 1: Hello, world! -->
  <text x="200" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">"Hello, world!"</text>
  <rect x="168" y="192" width="28" height="48" rx="3" fill="#2563eb"/>
  <rect x="200" y="186" width="28" height="54" rx="3" fill="#93c5fd"/>
  <text x="184" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af">4</text>
  <text x="214" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">5</text>
  <text x="200" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">GPT · Llama</text>

  <!-- Group 2: JSON -->
  <text x="360" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">JSON snippet</text>
  <text x="360" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">{"key":"value"}</text>
  <rect x="328" y="132" width="28" height="108" rx="3" fill="#2563eb"/>
  <rect x="360" y="126" width="28" height="114" rx="3" fill="#93c5fd"/>
  <text x="344" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af">9</text>
  <text x="374" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">10</text>
  <text x="360" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">GPT · Llama</text>

  <!-- Group 3: Code -->
  <text x="520" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">Python function</text>
  <text x="520" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">def fibonacci(n): &</text>
  <rect x="488" y="108" width="28" height="132" rx="3" fill="#2563eb"/>
  <rect x="520" y="96" width="28" height="144" rx="3" fill="#93c5fd"/>
  <text x="504" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#1e40af">11</text>
  <text x="536" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">12</text>
  <text x="520" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">GPT · Llama</text>

  <!-- Highlight callout -->
  <rect x="580" y="148" width="120" height="72" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="640" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#c2410c">Code / JSON</text>
  <text x="640" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9a3412">H2× prose</text>
  <text x="640" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9a3412">Lab 1: e15%</text>
  <text x="640" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9a3412">delta on code</text>

  <!-- Legend -->
  <rect x="24" y="262" width="16" height="12" rx="2" fill="#2563eb"/>
  <text x="46" y="272" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">GPT-4o Mini (tiktoken)</text>
  <rect x="200" y="262" width="16" height="12" rx="2" fill="#93c5fd"/>
  <text x="222" y="272" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Llama 3.1 (SentencePiece)</text>
</svg>
