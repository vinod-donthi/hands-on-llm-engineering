<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">Nested AI ML DL GenAI stack</title>
  <desc id="desc">Concentric rings from AI down to GenAI with one product example per layer.</desc>
  <rect width="720" height="240" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Nested stack: AI contains ML contains DL contains GenAI</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">LLMs are one slice -- not every problem needs them</text>

  <!-- Rings -->
  <rect x="40" y="58" width="640" height="160" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="56" y="78" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">AI</text>
  <text x="120" y="78" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">rules, search, ML</text>

  <rect x="80" y="88" width="560" height="120" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="96" y="108" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">ML</text>
  <text x="140" y="108" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">XGBoost, spam filter</text>

  <rect x="120" y="118" width="480" height="80" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="136" y="138" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8">DL</text>
  <text x="180" y="138" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Transformers, CNNs</text>

  <rect x="160" y="148" width="400" height="40" rx="6" fill="#2563eb"/>
  <text x="360" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">GenAI / LLMs</text>
  <text x="360" y="181" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#bfdbfe">GPT-4o, Claude, Llama</text>

  <text x="360" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Tabular loan default? XGBoost. Customer email? LLM.</text>
</svg>
