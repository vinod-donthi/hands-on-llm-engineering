<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">BPE merge steps on the phrase the cat</title>
  <desc id="desc">Four stages showing byte-pair encoding merges: characters merge into th, then the, then cat becomes one token.</desc>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">BPE merge steps - worked example: &quot;the cat&quot;</text>
  <text x="360" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Repeated merges on training corpus; rare words stay split longer</text>

  <!-- Step 0 -->
  <text x="24" y="78" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">Start</text>
  <g transform="translate(24, 86)">
    <rect width="48" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1a1a1a">t</text>
    <rect x="52" width="48" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="76" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1a1a1a">h</text>
    <rect x="104" width="48" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="128" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1a1a1a">e</text>
    <rect x="156" width="56" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="184" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">sp</text>
    <rect x="216" width="48" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="240" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1a1a1a">c</text>
    <rect x="268" width="48" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="292" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1a1a1a">a</text>
    <rect x="320" width="48" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="344" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1a1a1a">t</text>
  </g>

  <!-- Step 1 -->
  <text x="24" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2563eb">Merge 1: t+h becomes &quot;th&quot;</text>
  <g transform="translate(24, 160)">
    <rect width="72" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="36" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#1e40af">th</text>
    <rect x="80" width="48" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="104" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1a1a1a">e</text>
    <rect x="132" width="56" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="160" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">sp</text>
    <rect x="192" width="48" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="216" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1a1a1a">c</text>
    <rect x="244" width="48" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="268" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1a1a1a">a</text>
    <rect x="296" width="48" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="320" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1a1a1a">t</text>
  </g>
  <text x="420" y="182" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Most frequent pair: t + h</text>

  <!-- Step 2 -->
  <text x="24" y="232" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2563eb">Merge 2: th+e becomes &quot;the&quot;</text>
  <g transform="translate(24, 240)">
    <rect width="88" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="44" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#1e40af">the</text>
    <rect x="96" width="56" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="124" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">sp</text>
    <rect x="156" width="48" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="180" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1a1a1a">c</text>
    <rect x="208" width="48" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="232" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1a1a1a">a</text>
    <rect x="260" width="48" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="284" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#1a1a1a">t</text>
  </g>

  <!-- Step 3 -->
  <text x="24" y="312" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2563eb">Merge 3: space+cat becomes &quot; cat&quot;</text>
  <g transform="translate(24, 320)">
    <rect width="88" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="44" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#1e40af">the</text>
    <rect x="96" width="88" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="140" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#1e40af"> cat</text>
  </g>
  <text x="24" y="382" font-family="system-ui, sans-serif" font-size="12" fill="#166534" font-weight="600">Result: 2 tokens (&quot;the&quot; + &quot; cat&quot;)</text>

  <!-- Legend -->
  <rect x="470" y="218" width="230" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="578" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Legend</text>
  <rect x="486" y="252" width="24" height="16" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="518" y="264" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Single character / byte</text>
  <rect x="486" y="278" width="24" height="16" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="518" y="290" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Merged token (new vocab entry)</text>
  <text x="486" y="318" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">sp = space character</text>
</svg>
