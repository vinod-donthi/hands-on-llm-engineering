<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">RNN sequential processing vs Transformer self-attention</title>
  <desc id="desc">RNN reads tokens one at a time with a passing memory; Transformer lets every token attend to every other token in parallel.</desc>
  <defs>
    <marker id="seqArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="memArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Old way vs new way: reading a sentence</text>

  <!-- Left panel: RNN -->
  <rect x="16" y="40" width="336" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="184" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">RNN / LSTM (before 2017)</text>
  <text x="184" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">One token at a time, memory passed forward</text>

  <!-- Sequential arrows in gaps between token boxes -->
  <line x1="94" y1="146" x2="108" y2="146" stroke="#64748b" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <line x1="166" y1="146" x2="180" y2="146" stroke="#64748b" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <line x1="238" y1="146" x2="252" y2="146" stroke="#64748b" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <rect x="40" y="130" width="52" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="66" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1a1a1a">The</text>
  <rect x="112" y="130" width="52" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="138" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1a1a1a">cat</text>
  <rect x="184" y="130" width="52" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="210" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1a1a1a">sat</text>
  <rect x="256" y="130" width="52" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="282" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1a1a1a">down</text>

  <rect x="108" y="100" width="120" height="22" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="168" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c2410c">hidden state (memory)</text>
  <line x1="168" y1="122" x2="168" y2="128" stroke="#ea580c" stroke-width="1.5" marker-end="url(#memArrow)"/>
  <path d="M 168 100 L 168 92 L 236 92 L 236 128" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="184" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Step 1, then step 2, then step 3...</text>
  <text x="184" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Hard to parallelize on GPUs</text>

  <!-- Right panel: Transformer -->
  <rect x="368" y="40" width="336" height="200" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="536" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e40af">Transformer (2017+)</text>
  <text x="536" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">All tokens processed together via self-attention</text>

  <!-- Token top-center anchors: The=418, cat=486, sat=554, down=622 at y=158 -->
  <!-- Faint attention arcs (other pairs), drawn behind tokens -->
  <path d="M 418 158 Q 486 100 554 158" fill="none" stroke="#bfdbfe" stroke-width="1"/>
  <path d="M 418 158 Q 520 95 622 158" fill="none" stroke="#bfdbfe" stroke-width="1"/>
  <path d="M 554 158 Q 588 115 622 158" fill="none" stroke="#bfdbfe" stroke-width="1"/>

  <!-- Bold arcs: "cat" attends to all others (example) -->
  <path d="M 418 158 Q 452 108 486 158" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M 486 158 Q 520 108 554 158" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M 486 158 Q 554 98 622 158" fill="none" stroke="#2563eb" stroke-width="1.5"/>

  <text x="486" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1e40af">cat attends to all tokens</text>
  <line x1="486" y1="104" x2="486" y2="128" stroke="#2563eb" stroke-width="1"/>

  <!-- Token boxes on top of arcs -->
  <rect x="392" y="130" width="52" height="32" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="418" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1e40af">The</text>
  <rect x="460" y="130" width="52" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="486" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#1e40af">cat</text>
  <rect x="528" y="130" width="52" height="32" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="554" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1e40af">sat</text>
  <rect x="596" y="130" width="52" height="32" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="622" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1e40af">down</text>

  <text x="536" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">arcs = attention weights (every token pair)</text>
  <text x="536" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Every token connects to every other token</text>
  <text x="536" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Parallel training at scale</text>
</svg>
