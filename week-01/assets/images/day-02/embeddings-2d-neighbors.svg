<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">2D embedding space with word analogy neighbors</title>
  <desc id="desc">king, queen, man, and woman as points; the gender direction from man to woman parallels king to queen.</desc>
  <defs>
    <marker id="vecArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="vecOrange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Similar meaning maps to nearby points (2D slice)</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Illustrative layout -- real embeddings have hundreds of dimensions</text>

  <!-- Chart frame -->
  <line x1="80" y1="230" x2="520" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="80" y1="70" x2="80" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="300" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">dimension 1</text>
  <text x="48" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" transform="rotate(-90 48 150)">dimension 2</text>

  <!-- Vectors (behind dots): man->woman and king->queen -->
  <line x1="160" y1="188" x2="318" y2="92" stroke="#ea580c" stroke-width="1.5" marker-end="url(#vecOrange)"/>
  <line x1="200" y1="168" x2="378" y2="78" stroke="#2563eb" stroke-width="1.5" marker-end="url(#vecArrow)"/>
  <text x="238" y="124" font-family="system-ui, sans-serif" font-size="9" fill="#c2410c">man to woman</text>
  <line x1="238" y1="128" x2="248" y2="136" stroke="#ea580c" stroke-width="1"/>
  <text x="298" y="108" font-family="system-ui, sans-serif" font-size="9" fill="#1e40af">king to queen</text>
  <line x1="298" y1="112" x2="308" y2="118" stroke="#2563eb" stroke-width="1"/>

  <!-- Points -->
  <circle cx="160" cy="188" r="7" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="160" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#9a3412">man</text>

  <circle cx="200" cy="168" r="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="154" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1e40af">king</text>

  <circle cx="318" cy="92" r="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="318" y="78" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#9a3412">woman</text>

  <circle cx="378" cy="78" r="7" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="378" y="64" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1e40af">queen</text>

  <!-- Python vs finance cluster hint -->
  <ellipse cx="200" cy="178" rx="88" ry="48" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="200" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">royalty / gender cluster</text>

  <rect x="540" y="88" width="160" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="620" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">Lab 2 / RAG idea</text>
  <text x="620" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Query vector near</text>
  <text x="620" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">doc vectors on same topic</text>
  <text x="620" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">far from unrelated docs</text>
</svg>
