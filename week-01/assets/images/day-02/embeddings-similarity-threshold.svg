<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Cosine similarity scores vs match threshold</title>
  <desc id="desc">Query compared to three docs; scores above 0.7 threshold match, Doc B falls below.</desc>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Query vs documents: cosine similarity (example scores)</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">How do I loop in Python? -- compared to Docs A, B, C from the table above</text>

  <!-- Chart frame -->
  <rect x="140" y="58" width="420" height="36" fill="#f1f5f9" stroke="none"/>
  <line x1="140" y1="58" x2="560" y2="58" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="140" y1="94" x2="560" y2="94" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="140" y1="58" x2="140" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="560" y1="58" x2="560" y2="200" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="140" y1="200" x2="560" y2="200" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="140" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">document</text>
  <text x="350" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">cosine similarity (0 to 1)</text>

  <!-- X-axis ticks -->
  <line x1="224" y1="200" x2="224" y2="206" stroke="#cbd5e1"/>
  <text x="224" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">0.2</text>
  <line x1="308" y1="200" x2="308" y2="206" stroke="#cbd5e1"/>
  <text x="308" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">0.4</text>
  <line x1="392" y1="200" x2="392" y2="206" stroke="#cbd5e1"/>
  <text x="392" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">0.6</text>
  <line x1="476" y1="200" x2="476" y2="206" stroke="#cbd5e1"/>
  <text x="476" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">0.8</text>
  <text x="560" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">1.0</text>

  <!-- Threshold line at 0.7 = x 140 + 0.7*420 = 434 -->
  <line x1="434" y1="94" x2="434" y2="200" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="442" y="108" font-family="system-ui, sans-serif" font-size="9" fill="#c2410c">threshold 0.7</text>
  <line x1="434" y1="112" x2="434" y2="118" stroke="#ea580c" stroke-width="1"/>

  <!-- Doc A: 0.89 -->
  <text x="132" y="124" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#1a1a1a">Doc A</text>
  <text x="132" y="136" text-anchor="end" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Python loops</text>
  <rect x="140" y="112" width="374" height="20" rx="3" fill="#2563eb"/>
  <text x="518" y="126" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#ffffff">0.89</text>

  <!-- Doc C: 0.85 -->
  <text x="132" y="156" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#1a1a1a">Doc C</text>
  <text x="132" y="168" text-anchor="end" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">for x in items</text>
  <rect x="140" y="148" width="357" height="20" rx="3" fill="#93c5fd"/>
  <text x="501" y="162" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#1e40af">0.85</text>

  <!-- Doc B: 0.12 -->
  <text x="132" y="188" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#1a1a1a">Doc B</text>
  <text x="132" y="200" text-anchor="end" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Q3 revenue</text>
  <rect x="140" y="180" width="50" height="20" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="196" y="194" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">0.12</text>

  <!-- Legend -->
  <rect x="140" y="232" width="12" height="12" rx="2" fill="#2563eb"/>
  <text x="158" y="242" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">match (above threshold)</text>
  <rect x="320" y="232" width="12" height="12" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="338" y="242" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">no match (different topic)</text>
</svg>
