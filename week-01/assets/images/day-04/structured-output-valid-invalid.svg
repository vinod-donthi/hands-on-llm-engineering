<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Valid JSON vs broken model output</title>
  <desc id="desc">Side-by-side: prompt-only output with prose and fences vs structured output with correct types.</desc>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Prompt-only vs structured output</text>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">json.loads() fails on prose; Pydantic fails on wrong types</text>

  <!-- Bad panel -->
  <text x="180" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">Prompt-only (fragile)</text>
  <rect x="40" y="70" width="280" height="140" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="56" y="92" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Sure! Here is the JSON:</text>
  <text x="56" y="108" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">```json</text>
  <text x="56" y="124" font-family="ui-monospace, monospace" font-size="9" fill="#1a1a1a">{&quot;name&quot;:&quot;John&quot;,&quot;age&quot;:&quot;34&quot;}</text>
  <text x="56" y="140" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">```</text>
  <rect x="56" y="152" width="120" height="20" rx="3" fill="#fecaca"/>
  <text x="116" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#b91c1c">json.loads() fails</text>
  <text x="180" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Prose + fences + string age</text>

  <!-- Good panel -->
  <text x="540" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">Structured + Pydantic</text>
  <rect x="400" y="70" width="280" height="140" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="416" y="92" font-family="ui-monospace, monospace" font-size="9" fill="#1a1a1a">{&quot;name&quot;:&quot;John Doe&quot;,</text>
  <text x="416" y="108" font-family="ui-monospace, monospace" font-size="9" fill="#1a1a1a"> &quot;email&quot;:&quot;john@example.com&quot;,</text>
  <text x="416" y="124" font-family="ui-monospace, monospace" font-size="9" fill="#2563eb"> &quot;age&quot;: 34}</text>
  <rect x="416" y="140" width="140" height="20" rx="3" fill="#bbf7d0"/>
  <text x="486" y="154" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#166534">parse_status: success</text>
  <text x="540" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Clean JSON, age is integer</text>

  <text x="360" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">One model parse_failure must not crash a 3-model compare</text>
</svg>
